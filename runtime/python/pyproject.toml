[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "znagent"
version = "0.1.0"
description = "ZN resident runtime"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "comtypes==1.4.16; sys_platform == 'win32'",
  "httpx[socks]==0.28.1",
  "keyring==25.7.0",
  "openai==2.24.0",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "psutil==7.2.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "PyYAML==6.0.3",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
anthropic = ["anthropic==0.87.0"]
exa = ["exa-py==2.10.2"]
firecrawl = ["firecrawl-py==4.17.0"]
browser = ["mcp==2.2.0", "playwright==1.62.0"]

[project.scripts]
zn-resident = "zn_agent.resident:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zn_agent", "zn_agent.*"]
