name: ZN Linux AppImage Update Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-linux-appimage-update-smoke.yml
      - apps/desktop/scripts/zn-appimage-update-smoke.mjs
      - apps/desktop/electron/zn-release-updater.ts
      - apps/desktop/electron/zn-release-application-gate.ts
      - apps/desktop/electron/zn-resident-update-readiness.ts
      - apps/desktop/electron/zn-resident-ipc.ts
      - apps/desktop/electron/zn-resident-process.ts
      - apps/desktop/electron/zn-resident-autostart.ts
      - apps/desktop/electron/zn-packaged-runtime.ts
      - apps/desktop/electron/zn-main.ts
      - apps/desktop/electron/zn-preload.ts
      - apps/desktop/electron-builder.zn.yml
      - apps/desktop/package.json
      - apps/desktop/scripts/stage-zn-runtime.mjs
      - agent/kernel/**
      - runtime/python/**

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096
  ZN_DESKTOP_UPDATE_CHANNEL_URL: https://127.0.0.1:9443/stable.json
  ZN_SMOKE_N_VERSION: '0.17.0'
  ZN_SMOKE_N_PLUS_1_VERSION: '0.17.1'
  ZN_SMOKE_N_RUNTIME_ID: 'version-0.17.0'
  ZN_SMOKE_N_PLUS_1_RUNTIME_ID: 'version-0.17.1'

concurrency:
  group: zn-linux-appimage-update-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage-update:
    name: Real AppImage N to N+1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install headless desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb openssl

      - name: Start isolated user systemd manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/$uid"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          [[ -S "$runtime_dir/bus" ]] || {
            echo "user bus missing at $runtime_dir/bus"
            sudo systemctl status "user@$uid.service" --no-pager || true
            exit 1
          }
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"

      - name: Build real N AppImage
        shell: bash
        env:
          ZN_RELEASE_VERSION: '0.17.0'
          ZN_RELEASE_COMMIT: smoke-n
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const file = 'apps/desktop/package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.version = process.env.ZN_RELEASE_VERSION
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          node apps/desktop/scripts/stage-zn-runtime.mjs
          npm run build --workspace apps/desktop
          rm -rf apps/desktop/release
          npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --linux AppImage --publish never
          mkdir -p .ci/appimage-update
          count="$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' | wc -l | tr -d ' ')"
          [[ "$count" == '1' ]] || { echo "expected one N AppImage, found $count"; find apps/desktop/release -maxdepth 1 -type f -print; exit 1; }
          cp "$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' -print -quit)" .ci/appimage-update/ZN-N.AppImage
          sha256sum .ci/appimage-update/ZN-N.AppImage

      - name: Build real N+1 AppImage
        shell: bash
        env:
          ZN_RELEASE_VERSION: '0.17.1'
          ZN_RELEASE_COMMIT: smoke-n-plus-1
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const file = 'apps/desktop/package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.version = process.env.ZN_RELEASE_VERSION
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          node apps/desktop/scripts/stage-zn-runtime.mjs
          npm run build --workspace apps/desktop
          rm -rf apps/desktop/release
          npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --linux AppImage --publish never
          count="$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' | wc -l | tr -d ' ')"
          [[ "$count" == '1' ]] || { echo "expected one N+1 AppImage, found $count"; find apps/desktop/release -maxdepth 1 -type f -print; exit 1; }
          cp "$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' -print -quit)" .ci/appimage-update/ZN-N-plus-1.AppImage
          sha256sum .ci/appimage-update/ZN-N-plus-1.AppImage

      - name: Run real installed AppImage updater continuity smoke
        shell: bash
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/zn-installed/ZN.AppImage"
          zn_home="$RUNNER_TEMP/zn-m8-home"
          diagnostics="$GITHUB_WORKSPACE/.ci/appimage-update/diagnostics"
          mkdir -p "$(dirname "$installed")" "$diagnostics"
          cp .ci/appimage-update/ZN-N.AppImage "$installed"
          chmod +x "$installed" .ci/appimage-update/ZN-N-plus-1.AppImage

          UPDATE_PATH="$GITHUB_WORKSPACE/.ci/appimage-update/ZN-N-plus-1.AppImage" \
          UPDATE_VERSION="$ZN_SMOKE_N_PLUS_1_VERSION" \
          node - <<'NODE' >"$diagnostics/channel-server.log" 2>&1 &
          const { execFileSync } = require('node:child_process')
          const { createHash } = require('node:crypto')
          const fs = require('node:fs')
          const https = require('node:https')
          const os = require('node:os')
          const path = require('node:path')

          const updatePath = process.env.UPDATE_PATH
          const version = process.env.UPDATE_VERSION
          const port = 9443
          const tlsDir = fs.mkdtempSync(path.join(os.tmpdir(), 'zn-m8-fixed-channel-'))
          const keyPath = path.join(tlsDir, 'key.pem')
          const certPath = path.join(tlsDir, 'cert.pem')
          execFileSync('openssl', [
            'req', '-x509', '-newkey', 'rsa:2048', '-nodes',
            '-keyout', keyPath, '-out', certPath, '-days', '1',
            '-subj', '/CN=127.0.0.1', '-addext', 'subjectAltName=IP:127.0.0.1'
          ], { stdio: 'ignore' })
          const bytes = fs.readFileSync(updatePath)
          const sha256 = createHash('sha256').update(bytes).digest('hex')
          const base = `https://127.0.0.1:${port}`
          const manifest = {
            schema: 1,
            product: 'ZN',
            channel: 'stable',
            version,
            release_url: `${base}/releases/${version}`,
            notes: {
              new: ['M8 real AppImage updater smoke'],
              improvements: [],
              fixes: [],
              impact: ['Resident identity and durable work must survive N to N+1.']
            },
            targets: [{
              platform: 'linux',
              arch: process.arch,
              name: 'ZN-N-plus-1.AppImage',
              url: `${base}/ZN-N-plus-1.AppImage`,
              size: bytes.length,
              sha256
            }]
          }
          const server = https.createServer({
            key: fs.readFileSync(keyPath),
            cert: fs.readFileSync(certPath)
          }, (request, response) => {
            const pathname = new URL(request.url || '/', base).pathname
            console.log(new Date().toISOString(), request.method, pathname)
            if (pathname === '/stable.json') {
              const body = Buffer.from(JSON.stringify(manifest))
              response.writeHead(200, {
                'content-type': 'application/json',
                'content-length': String(body.length),
                'cache-control': 'no-store'
              })
              response.end(body)
              return
            }
            if (pathname === '/ZN-N-plus-1.AppImage') {
              response.writeHead(200, {
                'content-type': 'application/octet-stream',
                'content-length': String(bytes.length),
                'cache-control': 'no-store'
              })
              response.end(bytes)
              return
            }
            response.writeHead(404)
            response.end('not found')
          })
          server.listen(port, '127.0.0.1', () => {
            console.log(`ZN M8 fixed release channel listening at ${base}/stable.json`)
          })
          NODE
          channel_pid=$!
          trap 'kill "$channel_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -ksSf "$ZN_DESKTOP_UPDATE_CHANNEL_URL" >"$diagnostics/channel.json"; then
              break
            fi
            if [[ "$attempt" == '40' ]]; then
              echo "fixed update channel did not become ready"
              cat "$diagnostics/channel-server.log" || true
              exit 1
            fi
            sleep 0.25
          done

          xvfb-run -a node apps/desktop/scripts/zn-appimage-update-smoke.mjs \
            "$installed" \
            "$GITHUB_WORKSPACE/.ci/appimage-update/ZN-N-plus-1.AppImage" \
            "$zn_home" 2>&1 | tee "$diagnostics/proof.txt"

      - name: Capture smoke diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          diagnostics="$GITHUB_WORKSPACE/.ci/appimage-update/diagnostics"
          mkdir -p "$diagnostics"
          cp "$RUNNER_TEMP/zn-m8-home/kernel/resident-endpoint.json" "$diagnostics/resident-endpoint.json" 2>/dev/null || true
          cp "$HOME/.config/systemd/user/zn-resident.service" "$diagnostics/zn-resident.service" 2>/dev/null || true
          systemctl --user status zn-resident.service --no-pager >"$diagnostics/systemd-status.txt" 2>&1 || true
          journalctl --user -u zn-resident.service --no-pager -n 200 >"$diagnostics/systemd-journal.txt" 2>&1 || true

      - name: Upload smoke proof and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zn-linux-appimage-update-smoke-${{ github.sha }}
          path: .ci/appimage-update/diagnostics/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish AppImage update smoke status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Linux AppImage Update Smoke',
              description: `real AppImage N -> N+1 resident continuity: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
