name: ZN Linux AppImage Update Smoke

# Dormant platform lane: ZN product development is Windows-only for now.
# Preserve this workflow for future Linux work, but skip it before runner allocation
# unless the repository explicitly opts in with ZN_ENABLE_NON_WINDOWS_CI=true.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096
  ZN_SMOKE_N_VERSION: '0.17.0'
  ZN_SMOKE_N_PLUS_1_VERSION: '0.17.1'
  ZN_SMOKE_N_RUNTIME_ID: 'version-0.17.0'
  ZN_SMOKE_N_PLUS_1_RUNTIME_ID: 'version-0.17.1'

concurrency:
  group: zn-linux-appimage-update-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage-update:
    if: ${{ vars.ZN_ENABLE_NON_WINDOWS_CI == 'true' }}
    name: Real AppImage N to N+1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish AppImage smoke pending status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ZN Linux AppImage Update Smoke',
              description: 'real AppImage N -> N+1 resident continuity: running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: runtime/python/pyproject.toml

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Install headless desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb openssl

      - name: Start isolated user systemd manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/$uid"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          [[ -S "$runtime_dir/bus" ]] || {
            echo "user bus missing at $runtime_dir/bus"
            sudo systemctl status "user@$uid.service" --no-pager || true
            exit 1
          }
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"

      - name: Build real N AppImage
        shell: bash
        env:
          ZN_RELEASE_VERSION: '0.17.0'
          ZN_RELEASE_COMMIT: smoke-n
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const file = 'apps/desktop/package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.version = process.env.ZN_RELEASE_VERSION
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          node apps/desktop/scripts/stage-zn-runtime.mjs
          npm run build --workspace apps/desktop
          rm -rf apps/desktop/release
          npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --linux AppImage --publish never
          mkdir -p .ci/appimage-update
          count="$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' | wc -l | tr -d ' ')"
          [[ "$count" == '1' ]] || { echo "expected one N AppImage, found $count"; find apps/desktop/release -maxdepth 1 -type f -print; exit 1; }
          cp "$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' -print -quit)" .ci/appimage-update/ZN-N.AppImage
          sha256sum .ci/appimage-update/ZN-N.AppImage

      - name: Build real N+1 AppImage
        shell: bash
        env:
          ZN_RELEASE_VERSION: '0.17.1'
          ZN_RELEASE_COMMIT: smoke-n-plus-1
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const file = 'apps/desktop/package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.version = process.env.ZN_RELEASE_VERSION
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          node apps/desktop/scripts/stage-zn-runtime.mjs
          npm run build --workspace apps/desktop
          rm -rf apps/desktop/release
          npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --linux AppImage --publish never
          count="$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' | wc -l | tr -d ' ')"
          [[ "$count" == '1' ]] || { echo "expected one N+1 AppImage, found $count"; find apps/desktop/release -maxdepth 1 -type f -print; exit 1; }
          cp "$(find apps/desktop/release -maxdepth 1 -type f -name 'ZN-*.AppImage' -print -quit)" .ci/appimage-update/ZN-N-plus-1.AppImage
          sha256sum .ci/appimage-update/ZN-N-plus-1.AppImage

      - name: Run real installed AppImage updater continuity smoke
        shell: bash
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/zn-installed/ZN.AppImage"
          zn_home="$RUNNER_TEMP/zn-m8-home"
          diagnostics="$GITHUB_WORKSPACE/.ci/appimage-update/diagnostics"
          mkdir -p "$(dirname "$installed")" "$diagnostics"
          cp .ci/appimage-update/ZN-N.AppImage "$installed"
          chmod +x "$installed" .ci/appimage-update/ZN-N-plus-1.AppImage

          timeout --foreground --signal=TERM --kill-after=10s 15m \
            xvfb-run -a node apps/desktop/scripts/zn-appimage-update-smoke.mjs \
              "$installed" \
              "$GITHUB_WORKSPACE/.ci/appimage-update/ZN-N-plus-1.AppImage" \
              "$zn_home" 2>&1 | tee "$diagnostics/proof.txt"

      - name: Capture smoke diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          diagnostics="$GITHUB_WORKSPACE/.ci/appimage-update/diagnostics"
          mkdir -p "$diagnostics"
          cp "$RUNNER_TEMP/zn-m8-home/kernel/resident-endpoint.json" "$diagnostics/resident-endpoint.json" 2>/dev/null || true
          cp "$HOME/.config/systemd/user/zn-resident.service" "$diagnostics/zn-resident.service" 2>/dev/null || true
          systemctl --user status zn-resident.service --no-pager >"$diagnostics/systemd-status.txt" 2>&1 || true
          journalctl --user -u zn-resident.service --no-pager -n 200 >"$diagnostics/systemd-journal.txt" 2>&1 || true

      - name: Upload smoke proof and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zn-linux-appimage-update-smoke-${{ github.sha }}
          path: .ci/appimage-update/diagnostics/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish AppImage update smoke status
        if: ${{ always() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Linux AppImage Update Smoke',
              description: `real AppImage N -> N+1 resident continuity: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
