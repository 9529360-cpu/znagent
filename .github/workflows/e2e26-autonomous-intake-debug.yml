name: E2E26 Autonomous Intake Debug

on:
  push:
    branches:
      - debug/e2e26-autonomous-intake
  workflow_dispatch:

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  debug:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/autonomous-intake-venv -ErrorAction SilentlyContinue
          uv venv .ci/autonomous-intake-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\autonomous-intake-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Run composed autonomous broad Work regressions
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\autonomous-intake-venv\Scripts\python.exe'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & $python -m unittest tests.zn_agent.core.test_broad_goal_autonomous_intake tests.zn_agent.core.test_broad_goal_research_layer tests.zn_agent.core.test_broad_goal_terminal_repair tests.zn_agent.core.test_broad_goal_independent_completion_v2 tests.zn_agent.core.test_broad_goal_steering_continuity -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import tempfile; from pathlib import Path; from zn_agent.core.broad_goal_autonomous_resident import BroadGoalAutonomousResidentRuntime; from zn_agent.core.provider_bridge import build_resident_runtime; tmp=tempfile.TemporaryDirectory(); r=build_resident_runtime(config={'model': {}}, store_path=Path(tmp.name)/'kernel.db'); assert isinstance(r, BroadGoalAutonomousResidentRuntime), type(r); r.store.close(); tmp.cleanup()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove final accounting harness blocks without a real model
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\autonomous-intake-venv\Scripts\python.exe'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & $python -m unittest tests.zn_agent.e2e.test_e2e26_autonomous_accounting -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
