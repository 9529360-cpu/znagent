name: Memory and Learned Behavior E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-memory-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-memory-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-learned-behavior:
    name: E2E-37-39 / Windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 20
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/memory-venv -ErrorAction SilentlyContinue
          uv venv .ci/memory-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\memory-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
          New-Item -ItemType Directory -Force -Path .ci/memory-logs | Out-Null
      - name: E2E-37 preferred working style
        id: e2e37
        continue-on-error: true
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\memory-venv\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_e2e37_preferred_working_style.py -v 2>&1 | Tee-Object -FilePath .ci/memory-logs/e2e37.txt
          exit $LASTEXITCODE
      - name: E2E-38 learned verified workflow
        id: e2e38
        continue-on-error: true
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\memory-venv\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_e2e38_learned_verified_workflow.py -v 2>&1 | Tee-Object -FilePath .ci/memory-logs/e2e38.txt
          exit $LASTEXITCODE
      - name: E2E-39 learned path drift
        id: e2e39
        continue-on-error: true
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\memory-venv\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_e2e39_learned_path_drift.py -v 2>&1 | Tee-Object -FilePath .ci/memory-logs/e2e39.txt
          exit $LASTEXITCODE
      - name: Upload Memory E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-e2e-diagnostics
          path: .ci/memory-logs/*.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Memory E2E acceptance
        if: steps.e2e37.outcome == 'failure' || steps.e2e38.outcome == 'failure' || steps.e2e39.outcome == 'failure'
        run: exit 1
