name: E2E30-42 Real Multi-Provider Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e30-42-real-multiroute-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_E2E30_42_REAL_MODELS: '1'

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

# Guarded product acceptance. It intentionally fails if the configured host
# does not expose two distinct real providers or if any unittest skips.
jobs:
  real-e2e:
    name: Real multi-provider delegated Work + policy
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 50
    steps:
      - name: Require configured interactive Windows host
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "E2E-30/42 acceptance requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -ne 'zn-interactive') {
            throw "E2E-30/42 acceptance requires zn-interactive; got $env:RUNNER_NAME"
          }
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime with provider transports and managed Chromium
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/e2e30-42-real-venv -ErrorAction SilentlyContinue
          uv venv .ci/e2e30-42-real-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e30-42-real-venv\Scripts\python.exe'
          Push-Location runtime/python
          try {
            uv pip install --python $python '.[browser,anthropic]'
          } finally {
            Pop-Location
          }
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print sanitized configured route inventory
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e30-42-real-venv\Scripts\python.exe'
          @'
          import json
          from zn_agent.core.cognitive_factory import resolve_zn_cognitive_route
          from zn_agent.core.cognitive_resource import _infer_provider
          from zn_agent.core.config import load_zn_config
          from zn_agent.core.provider_bridge import build_zn_cognitive_resource_plan
          from zn_agent.core.router import ModelRouter

          def provider_family(route):
              resolved = resolve_zn_cognitive_route(route)
              family = str(resolved.provider or "").strip().lower()
              if family == "custom":
                  # A configurable OpenAI-compatible transport may be labelled
                  # "custom", but known official provider endpoints are not a
                  # second independent provider family. Pass an empty environment
                  # so this audit uses endpoint identity only and never ambient
                  # credential names.
                  endpoint_family = _infer_provider(resolved.metadata.get("base_url"), {})
                  if endpoint_family != "custom":
                      family = endpoint_family
              return family

          plan = build_zn_cognitive_resource_plan(load_zn_config())
          safe = []
          for route in plan.routes:
              if route.provider == "none":
                  continue
              safe.append(
                  {
                      "route_id": route.route_id,
                      "provider": route.provider,
                      "provider_family": provider_family(route),
                      "model": route.model,
                      "capabilities": sorted(route.capabilities),
                      "local": ModelRouter._is_explicit_local_route(route),
                      "deployment": route.metadata.get("deployment"),
                  }
              )
          print("ZN_E2E30_42_CONFIGURED_ROUTES=" + json.dumps(safe, ensure_ascii=False), flush=True)
          if not plan.available:
              raise SystemExit("configured cognitive resource plan unavailable: " + str(plan.error))
          providers = {item["provider_family"] for item in safe}
          if len(providers) < 2:
              raise SystemExit(
                  "E2E-30/42 requires at least two configured real provider families; found "
                  + repr(sorted(providers))
              )
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run guarded E2E-30/42 and fail on any skip
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e30-42-real-venv\Scripts\python.exe'
          $log = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e30-42-real.log'
          Remove-Item -Force $log -ErrorAction SilentlyContinue
          @'
          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          test_path = Path("tests/zn_agent/e2e/test_e2e30_42_real_multiroute_policy.py").resolve()
          spec = importlib.util.spec_from_file_location("zn_e2e30_42_real", test_path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load E2E-30/42 test module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 4:
              raise SystemExit(f"expected exactly four E2E-30/42 acceptance tests, got {suite.countTestCases()}")
          result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite)
          print("ZN_E2E30_42_SKIPPED=" + str(len(result.skipped)), flush=True)
          print("ZN_E2E30_42_FAILURES=" + str(len(result.failures)), flush=True)
          print("ZN_E2E30_42_ERRORS=" + str(len(result.errors)), flush=True)
          if result.skipped:
              raise SystemExit("E2E-30/42 real acceptance skipped: " + repr(result.skipped))
          if not result.wasSuccessful():
              raise SystemExit(1)
          '@ | & $python - 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload guarded E2E-30/42 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e30-42-real-multiroute-transcript
          path: .ci/e2e30-42-real.log
          if-no-files-found: warn
          retention-days: 7
