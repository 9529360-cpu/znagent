name: Apply E2E-23 bounded scandir patch

on:
  push:
    branches:
      - work/e2e23-command-path-replan
    paths:
      - .github/workflows/zz-apply-e2e23-scandir-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply exact bounded-scandir patch
        shell: powershell
        run: |
          python .github/scripts/zz-patch-e2e23-scandir.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check -- runtime/python/zn_agent/core/broad_goal_coding_resident.py tests/zn_agent/core/test_e2e23_command_path_replan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $expected = @(
            'runtime/python/zn_agent/core/broad_goal_coding_resident.py',
            'tests/zn_agent/core/test_e2e23_command_path_replan.py'
          )
          if ($changed.Count -ne 2 -or $expected[0] -notin $changed -or $expected[1] -notin $changed) {
            throw "Unexpected product patch write set: $($changed -join ', ')"
          }
          git diff -- runtime/python/zn_agent/core/broad_goal_coding_resident.py tests/zn_agent/core/test_e2e23_command_path_replan.py

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false

      - name: Run focused E2E-23 regression
        shell: powershell
        run: |
          uv python install 3.12
          uv venv .ci/e2e23-patch-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e23-patch-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & $python tests/zn_agent/core/test_e2e23_command_path_replan.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit tested patch and remove temporary helpers
        shell: powershell
        run: |
          git restore --worktree --staged -- runtime/python/build runtime/python/znagent.egg-info 2>$null
          git clean -fd -- runtime/python/build runtime/python/znagent.egg-info

          Remove-Item -LiteralPath '.github/scripts/zz-patch-e2e23-scandir.py' -Force
          Remove-Item -LiteralPath '.github/workflows/zz-apply-e2e23-scandir-patch.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- runtime/python/zn_agent/core/broad_goal_coding_resident.py tests/zn_agent/core/test_e2e23_command_path_replan.py
          git add -u -- .github/scripts/zz-patch-e2e23-scandir.py .github/workflows/zz-apply-e2e23-scandir-patch.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --cached --name-only)
          $expected = @(
            '.github/scripts/zz-patch-e2e23-scandir.py',
            '.github/workflows/zz-apply-e2e23-scandir-patch.yml',
            'runtime/python/zn_agent/core/broad_goal_coding_resident.py',
            'tests/zn_agent/core/test_e2e23_command_path_replan.py'
          )
          foreach ($path in $expected) {
            if ($path -notin $changed) { throw "Missing expected staged path: $path" }
          }
          if ($changed.Count -ne $expected.Count) {
            throw "Unexpected staged write set: $($changed -join ', ')"
          }
          $remaining = @(git status --porcelain --untracked-files=all)
          if ($remaining.Count -ne $expected.Count) {
            throw "Unexpected worktree residue before commit: $($remaining -join '; ')"
          }
          git commit -m 'fix: strictly bound stale path discovery'
          git push origin HEAD:work/e2e23-command-path-replan
