name: E2E26 Interactive Auth Debug

on:
  push:
    branches:
      - debug/e2e26-interactive-auth
  workflow_dispatch:

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 25
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/interactive-debug-venv -ErrorAction SilentlyContinue
          uv venv .ci/interactive-debug-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-debug-venv\Scripts\python.exe'
          uv pip install --python $python "runtime/python[browser]"
      - name: Run exact pre-extension product sequence then stress diagnostic
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-debug-venv\Scripts\python.exe'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $extensionName = 'test_windows_interactive_user_browser_extension.py'
          $excluded = @(
            'test_windows_interactive_authorized_user_browser_cdp.py',
            'test_windows_interactive_user_browser_named_goal.py'
          )
          $tests = Get-ChildItem tests/zn_agent/e2e/test_windows_interactive_*.py |
            Where-Object { $_.Name -notin $excluded -and $_.Name -lt $extensionName } |
            Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "=== pre-extension module: $($test.Name) ==="
            & $python $test.FullName -v
            if ($LASTEXITCODE -ne 0) { throw "Pre-extension module failed: $($test.Name)" }
          }
          1..5 | ForEach-Object {
            Write-Host "=== extension authorization diagnostic attempt: $_ ==="
            & $python .agent/e2e26_extension_focus_diagnostic.py
            if ($LASTEXITCODE -ne 0) { throw "Extension authorization diagnostic failed on attempt $_" }
          }
