name: One-shot Memory 1.0 docs sync

on:
  push:
    branches:
      - work/memory-learned-behavior-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/memory-learned-behavior-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Append narrow closure facts to required canonical docs
        run: python tools/sync_memory_learned_behavior_docs.py
      - name: Commit synchronized docs when needed
        run: |
          if git diff --quiet -- docs/ZN-REAL-TASK-E2E-CATALOG.md docs/ZN-PRODUCT-CAPABILITY-MAP.md docs/ZN-IMPLEMENTATION-STATUS.md docs/ZN-MEMORY-LEARNING.md docs/ZN-RESIDENT-INTELLIGENCE.md .agent/HANDOFF.md; then
            echo "Docs already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ZN-REAL-TASK-E2E-CATALOG.md docs/ZN-PRODUCT-CAPABILITY-MAP.md docs/ZN-IMPLEMENTATION-STATUS.md docs/ZN-MEMORY-LEARNING.md docs/ZN-RESIDENT-INTELLIGENCE.md .agent/HANDOFF.md
          git commit -m "Docs: record Memory & Learned Behavior 1.0 narrow closure"
          git push origin HEAD:work/memory-learned-behavior-v1
