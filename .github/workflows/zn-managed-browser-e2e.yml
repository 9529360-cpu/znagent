permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-managed-browser-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-browser-contract:
    name: Windows managed browser contract
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN managed browser contract requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN managed-browser runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 24 for pinned Chrome DevTools MCP
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated browser runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/managed-browser-venv -ErrorAction SilentlyContinue
          uv venv .ci/managed-browser-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          Push-Location runtime/python
          try {
            uv pip install --python $python '.[browser]'
          } finally {
            Pop-Location
          }
          & $python -m playwright install chromium
          $chromeMcpRoot = Join-Path $env:GITHUB_WORKSPACE '.ci\browser-runtimes\chrome-devtools-mcp'
          Remove-Item -Recurse -Force $chromeMcpRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $chromeMcpRoot | Out-Null
          npm install --prefix $chromeMcpRoot --no-save --package-lock=false --omit=dev --ignore-scripts chrome-devtools-mcp@1.9.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZN_CHROME_DEVTOOLS_MCP_ROOT=$chromeMcpRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run managed browser contract tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.core.test_browser_scene_actions -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests/zn_agent/core -p 'test_*browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest tests.zn_agent.core.test_structured_action_text_alias -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Chrome DevTools MCP BrowserAdapter contract
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.e2e.test_windows_managed_browser_provider_contract -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real local Chromium E2E
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          & $python -m unittest discover -s tests/zn_agent/e2e -p 'test_windows_managed_browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
