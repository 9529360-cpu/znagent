permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-managed-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-browser-e2e:
    name: Windows local managed Chromium E2E
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN managed browser E2E requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN managed-browser runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated browser runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/managed-browser-venv -ErrorAction SilentlyContinue
          uv venv .ci/managed-browser-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          Push-Location runtime/python
          try {
            uv pip install --python $python '.[browser]'
          } finally {
            Pop-Location
          }
          & $python -m playwright install chromium
      - name: Run managed browser contract tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.core.test_browser_scene_actions -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests/zn_agent/core -p 'test_*browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest tests.zn_agent.core.test_structured_action_text_alias -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real local Chromium E2E
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          & $python -m unittest discover -s tests/zn_agent/e2e -p 'test_windows_managed_browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run E2E-11 real Browser data to spreadsheet
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\managed-browser-venv\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_e2e11_browser_data_to_spreadsheet.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
