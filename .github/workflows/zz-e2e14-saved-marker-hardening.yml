name: E2E14 Saved Marker Hardening

on:
  push:
    branches:
      - work/e2e14-cross-app-transfer
    paths:
      - .github/workflows/zz-e2e14-saved-marker-hardening.yml

permissions:
  contents: write

jobs:
  harden-saved-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: work/e2e14-cross-app-transfer
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated Python
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .ci/e2e14-patch-venv
          uv venv .ci/e2e14-patch-venv --python 3.12
          uv pip install --python .ci/e2e14-patch-venv/bin/python runtime/python
      - name: Apply exact saved-marker hardening
        shell: bash
        run: |
          set -euo pipefail
          .ci/e2e14-patch-venv/bin/python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          product = Path('runtime/python/zn_agent/core/browser_desktop_record_transfer_behavior.py')
          replace_once(
              product,
              'import hashlib\nimport json\nimport time\nimport uuid\n',
              'import hashlib\nimport json\nimport re\nimport time\nimport uuid\n',
          )
          replace_once(
              product,
              'def _title_has_saved_marker(value: str) -> bool:\n    text = str(value or "")\n    return "已保存" in text or "saved" in text.casefold()\n',
              'def _title_has_saved_marker(value: str) -> bool:\n    text = str(value or "")\n    return "已保存" in text or re.search(\n        r"(?<![A-Za-z0-9_])saved(?![A-Za-z0-9_])",\n        text,\n        flags=re.IGNORECASE,\n    ) is not None\n',
          )

          behavior_test = Path('tests/zn_agent/core/test_browser_desktop_record_transfer_behavior.py')
          replace_once(
              behavior_test,
              '    _save_prepare,\n    _verify_replacement,\n',
              '    _save_prepare,\n    _title_has_saved_marker,\n    _verify_replacement,\n',
          )
          replace_once(
              behavior_test,
              '\n\nif __name__ == "__main__":\n    unittest.main()\n',
              '''\n\n    def test_saved_marker_requires_explicit_token_not_unsaved_substring(self):\n        self.assertTrue(_title_has_saved_marker("客户记录已保存"))\n        self.assertTrue(_title_has_saved_marker("Customer record - Saved"))\n        self.assertFalse(_title_has_saved_marker("Customer record Unsaved"))\n        self.assertFalse(_title_has_saved_marker("Customer record Autosaved"))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
          )

          e2e_test = Path('tests/zn_agent/e2e/test_windows_interactive_browser_desktop_record_transfer.py')
          replace_once(
              e2e_test,
              '            self.assertTrue(final.get("title_saved_postcondition"))\n            self.assertTrue(final.get("hwnd_changed"))\n',
              '            self.assertTrue(final.get("title_saved_postcondition"))\n            self.assertTrue(final.get("title_saved_transition"))\n            self.assertTrue(final.get("hwnd_changed"))\n',
          )
          PY
          git diff --check
      - name: Run focused deterministic E2E14 regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/runtime/python"
          .ci/e2e14-patch-venv/bin/python -m unittest discover -s tests/zn_agent/core -p 'test_browser_desktop_record_transfer*.py' -v
      - name: Commit exact hardening write set
        shell: bash
        run: |
          set -euo pipefail
          expected=$'runtime/python/zn_agent/core/browser_desktop_record_transfer_behavior.py\ntests/zn_agent/core/test_browser_desktop_record_transfer_behavior.py\ntests/zn_agent/e2e/test_windows_interactive_browser_desktop_record_transfer.py'
          actual="$(git diff --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected write set:\n%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/python/zn_agent/core/browser_desktop_record_transfer_behavior.py tests/zn_agent/core/test_browser_desktop_record_transfer_behavior.py tests/zn_agent/e2e/test_windows_interactive_browser_desktop_record_transfer.py
          git commit -m 'fix: require explicit E2E14 saved-state marker'
          git push origin HEAD:work/e2e14-cross-app-transfer

# Trigger after registration on the feature branch.
