name: ZN Maintenance Investigation Validation

on:
  push:
    branches:
      - work/maintenance-investigation-envelope
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home-maintenance-investigation

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  validate:
    name: Maintenance investigation lifecycle
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 10
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/maintenance-investigation-venv -ErrorAction SilentlyContinue
          uv venv .ci/maintenance-investigation-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\maintenance-investigation-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Compile changed resident modules
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\maintenance-investigation-venv\Scripts\python.exe'
          & $python -m py_compile runtime/python/zn_agent/core/maintenance_investigation.py runtime/python/zn_agent/core/health_aware_resident.py
      - name: Run maintenance investigation regression tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\maintenance-investigation-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.core.test_maintenance_investigation_lifecycle -v
      - name: Run adjacent health/status regression tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\maintenance-investigation-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.core.test_health_failure_classification tests.zn_agent.core.test_resident_health_status -v
