name: BrowserScene Action Branch Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scene-actions-diagnostic.yml'

permissions:
  contents: write

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Restore direct unittest execution
        run: |
          uv python install 3.12
          $python = (uv python find 3.12)
          @'
          from pathlib import Path

          path = Path(".github/workflows/zn-managed-browser-e2e.yml")
          text = path.read_text(encoding="utf-8")
          marker = "      - name: Run managed browser contract tests\n"
          start = text.index(marker)
          tail = """      - name: Run managed browser contract tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\\managed-browser-venv\\Scripts\\python.exe'
          & $python -m unittest tests.zn_agent.core.test_browser_scene_actions -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests/zn_agent/core -p 'test_*browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest tests.zn_agent.core.test_structured_action_text_alias -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real local Chromium E2E
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\\managed-browser-venv\\Scripts\\python.exe'
          & $python -m unittest discover -s tests/zn_agent/e2e -p 'test_windows_managed_browser*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""
          path.write_text(text[:start] + tail, encoding="utf-8")
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit workflow repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/zn-managed-browser-e2e.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "Browser Body V2: restore direct browser acceptance commands"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
