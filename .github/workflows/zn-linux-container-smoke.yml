name: ZN Linux Container Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  container:
    name: Optional Linux Container / Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: znagent-ci:dev
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Boot ZN inside container without a model
        run: |
          docker run --rm --entrypoint python \
            -e CI=true \
            -e TZ=UTC \
            -e PYTHONUTF8=1 \
            -e PYTHONUNBUFFERED=1 \
            -e ZN_AGENT_HOME=/tmp/znagent-ci \
            znagent-ci:dev \
            -c "from pathlib import Path; from zn_agent.core.provider_bridge import build_resident_runtime; p=Path('/tmp/znagent-ci'); p.mkdir(parents=True, exist_ok=True); r=build_resident_runtime(config={'model': {}}, store_path=p/'kernel.db'); pulse=r.pulse(); s=r.life.snapshot(); assert pulse.sequence >= 1 and s.body is not None and s.external_brains == (); r.store.close()"
