name: ZN Linux Container Smoke

# Dormant platform lane: ZN product development is Windows-only for now.
# Keep this workflow available for future Linux work, but do not allocate a runner
# unless the repository explicitly opts in with ZN_ENABLE_NON_WINDOWS_CI=true.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  container:
    if: ${{ vars.ZN_ENABLE_NON_WINDOWS_CI == 'true' }}
    name: Optional Linux Container / Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: znagent-ci:dev
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Boot ZN inside container without a model
        run: |
          docker run --rm --entrypoint python \
            -e CI=true \
            -e TZ=UTC \
            -e PYTHONUTF8=1 \
            -e PYTHONUNBUFFERED=1 \
            -e ZN_AGENT_HOME=/tmp/znagent-ci \
            znagent-ci:dev \
            -c "from pathlib import Path; from zn_agent.core.provider_bridge import build_resident_runtime; p=Path('/tmp/znagent-ci'); p.mkdir(parents=True, exist_ok=True); r=build_resident_runtime(config={'model': {}}, store_path=p/'kernel.db'); pulse=r.pulse(); s=r.life.snapshot(); assert pulse.sequence >= 1 and s.body is not None and s.external_brains == (); r.store.close()"
