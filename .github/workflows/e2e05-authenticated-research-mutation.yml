name: E2E05 Authenticated Research Mutation Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/e2e05-authenticated-research-mutation.yml'
      - 'runtime/python/zn_agent/core/user_browser_managed_research_resident.py'
      - 'runtime/python/zn_agent/core/user_browser_extension_resident.py'
      - 'runtime/python/zn_agent/core/user_browser_extension_adapter.py'
      - 'apps/desktop/browser-extension/background.js'
      - 'tests/zn_agent/e2e/test_e2e05_authenticated_research_note_mutation.py'

permissions:
  contents: read

concurrency:
  group: e2e05-authenticated-research-mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  real-e2e:
    name: Existing session research return and persisted note mutation
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 35
    steps:
      - name: Require configured interactive Windows host
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "E2E-05 acceptance requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -ne 'zn-interactive') {
            throw "E2E-05 acceptance requires zn-interactive; got $env:RUNNER_NAME"
          }
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime with browser support
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/e2e05-venv -ErrorAction SilentlyContinue
          uv venv .ci/e2e05-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e05-venv\Scripts\python.exe'
          Push-Location runtime/python
          try {
            uv pip install --python $python '.[browser,anthropic]'
          } finally {
            Pop-Location
          }
      - name: Run E2E-05 and fail on any skip
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e05-venv\Scripts\python.exe'
          $log = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e05-auth-research-mutation.log'
          Remove-Item -Force $log -ErrorAction SilentlyContinue
          @'
          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          test_path = Path("tests/zn_agent/e2e/test_e2e05_authenticated_research_note_mutation.py").resolve()
          spec = importlib.util.spec_from_file_location("zn_e2e05_auth_mutation", test_path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load E2E-05 test module")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          if suite.countTestCases() != 1:
              raise SystemExit(f"expected exactly one E2E-05 test, got {suite.countTestCases()}")
          result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite)
          print("ZN_E2E05_SKIPPED=" + str(len(result.skipped)), flush=True)
          print("ZN_E2E05_FAILURES=" + str(len(result.failures)), flush=True)
          print("ZN_E2E05_ERRORS=" + str(len(result.errors)), flush=True)
          if result.skipped:
              raise SystemExit("E2E-05 acceptance skipped: " + repr(result.skipped))
          if not result.wasSuccessful():
              raise SystemExit(1)
          '@ | & $python - 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload E2E-05 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e05-authenticated-research-mutation-transcript
          path: .ci/e2e05-auth-research-mutation.log
          if-no-files-found: warn
          retention-days: 7
