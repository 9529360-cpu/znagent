name: ZN Desktop Lock Sync

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/zn-agent

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Regenerate lock metadata only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lock update scope
        run: |
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | sed '/package-lock.json/d' | sed '/^$/d' | wc -l)" -eq 0

      - name: Commit synchronized lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize ZN desktop package lock [skip ci]'
          git push origin HEAD:dev/zn-agent
