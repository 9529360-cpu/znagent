name: Apply E2E-23 path hardening

on:
  push:
    branches:
      - work/e2e23-path-discovery-hardening
    paths:
      - .github/workflows/zz-e2e23-path-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Apply narrow resolver and regression patch
        run: python .agent/tmp_e2e23_path_hardening.py
      - name: Run focused E2E-23 core regressions
        run: |
          uv python install 3.12
          uv venv .ci/e2e23-hardening --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e23-hardening\Scripts\python.exe'
          uv pip install --python $python runtime/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & $python tests/zn_agent/core/test_e2e23_command_path_replan.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit only verified product and regression changes
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- runtime/python/zn_agent/core/broad_goal_coding_resident.py tests/zn_agent/core/test_e2e23_command_path_replan.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix: harden E2E-23 workspace path discovery'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:work/e2e23-path-discovery-hardening
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
