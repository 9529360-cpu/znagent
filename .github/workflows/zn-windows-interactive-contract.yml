permissions:
  contents: read

concurrency:
  group: zn-windows-interactive-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactive-desktop-contract:
    name: Windows interactive capability contracts
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Verify GitHub-hosted Windows x64 runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN interactive desktop Contract requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prove interactive desktop readiness
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-zn-interactive-desktop-readiness.ps1" -ExpectedRunnerName $env:RUNNER_NAME
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        shell: powershell
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/interactive-contract-venv -ErrorAction SilentlyContinue
          uv venv .ci/interactive-contract-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-contract-venv\Scripts\python.exe'
          uv pip install --python $python "runtime/python[browser]"
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) {
            throw 'Playwright Chromium runtime installation failed for interactive Contract'
          }
      - name: Run generic interactive capability contracts
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-contract-venv\Scripts\python.exe'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\run-zn-interactive-python.ps1'
          $ownedRunner = Join-Path $env:GITHUB_WORKSPACE 'tests\zn_agent\integration\_run_owned_unittest_module.py'
          $tests = @(
            'tests/zn_agent/integration/test_windows_interactive_pointer_uia.py',
            'tests/zn_agent/integration/test_windows_interactive_text_entry.py',
            'tests/zn_agent/integration/test_windows_interactive_uia_text_capability.py',
            'tests/zn_agent/integration/test_windows_interactive_user_browser_bridge.py',
            'tests/zn_agent/integration/test_windows_interactive_user_browser_extension.py',
            'tests/zn_agent/integration/test_windows_interactive_user_browser_semantic_grounding.py',
            'tests/zn_agent/integration/test_windows_interactive_user_browser_recovery_code.py',
            'tests/zn_agent/integration/test_windows_interactive_user_browser_task_context.py',
            'tests/zn_agent/integration/test_windows_interactive_machine_capability.py',
            'tests/zn_agent/integration/test_windows_interactive_application_activation.py'
          )
          foreach ($test in $tests) {
            $path = Join-Path $env:GITHUB_WORKSPACE $test
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Generic interactive contract is missing: $test"
            }
            Write-Host "=== interactive contract: $test ==="
            & $launcher -Python $python -CommandArgs @($ownedRunner, $path)
            if ($LASTEXITCODE -ne 0) {
              throw "Interactive capability contract failed: $test"
            }
          }
