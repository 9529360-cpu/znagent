name: SM4 Semantic Independence Validation

on:
  push:
    branches:
      - work/sm4-independent-semantic-review
    paths:
      - '.github/workflows/sm4-semantic-independence-validation.yml'
      - 'runtime/python/zn_agent/core/maintenance_cognition_journal.py'
      - 'tests/zn_agent/core/test_maintenance_semantic_independence.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home-sm4-semantic-independence

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  validate:
    name: SM4 semantic independence / Windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 25
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/sm4-semantic-independence-venv -ErrorAction SilentlyContinue
          uv venv .ci/sm4-semantic-independence-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-semantic-independence-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Compile semantic independence modules
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-semantic-independence-venv\Scripts\python.exe'
          & $python -m py_compile runtime/python/zn_agent/core/maintenance_cognition_journal.py tests/zn_agent/core/test_maintenance_semantic_independence.py
      - name: Run semantic and self-maintenance regressions
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-semantic-independence-venv\Scripts\python.exe'
          $env:PYTHONPATH = (Join-Path $env:GITHUB_WORKSPACE 'runtime\python')
          & $python -m unittest -v tests.zn_agent.core.test_maintenance_semantic_independence tests.zn_agent.core.test_maintenance_cognition_journal tests.zn_agent.core.test_maintenance_cognitive_repair tests.zn_agent.core.test_maintenance_publication tests.zn_agent.core.test_maintenance_attempt_lifecycle tests.zn_agent.core.test_maintenance_isolated_repair
