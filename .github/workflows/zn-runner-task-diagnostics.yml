name: ZN Runner Task Diagnostics

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-runner-task-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-diagnostics:
    name: Runner scheduler task evidence
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect watchdog task without exposing arguments
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { exit 0 }
          $task = Get-ScheduledTask -TaskPath '\' -TaskName 'ZN GitHub Actions Interactive Runner Watchdog' -ErrorAction Stop
          $info = Get-ScheduledTaskInfo -TaskPath '\' -TaskName $task.TaskName -ErrorAction Stop
          Write-Host "runner.scheduler.task.name=$($task.TaskName)"
          Write-Host "runner.scheduler.task.state=$($task.State)"
          Write-Host "runner.scheduler.task.last_run=$($info.LastRunTime)"
          Write-Host "runner.scheduler.task.last_result=$($info.LastTaskResult)"
          Write-Host "runner.scheduler.task.execution_time_limit=$($task.Settings.ExecutionTimeLimit)"
          Write-Host "runner.scheduler.task.restart_count=$($task.Settings.RestartCount)"
          Write-Host "runner.scheduler.task.restart_interval=$($task.Settings.RestartInterval)"

          $keywords = @('run.cmd','Runner.Listener','Start-Process','Stop-Process','taskkill','Wait-Process','timeout','Start-Sleep','sleep','120','Ctrl')
          $index = 0
          foreach ($action in $task.Actions) {
            $arguments = [string]$action.Arguments
            Write-Host "runner.scheduler.action[$index].execute=$($action.Execute)"
            Write-Host "runner.scheduler.action[$index].working_directory=$($action.WorkingDirectory)"
            Write-Host "runner.scheduler.action[$index].arguments_length=$($arguments.Length)"
            foreach ($keyword in $keywords) {
              $found = $arguments.IndexOf($keyword, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
              Write-Host "runner.scheduler.action[$index].contains.$keyword=$found"
            }
            $scriptMatches = [regex]::Matches($arguments, '(?i)(?:"|''|\s|^)([^"''\s]+\.ps1)(?:"|''|\s|$)')
            Write-Host "runner.scheduler.action[$index].ps1_reference_count=$($scriptMatches.Count)"
            foreach ($match in $scriptMatches) {
              Write-Host "runner.scheduler.action[$index].ps1_reference=$($match.Groups[1].Value)"
            }
            $index++
          }
