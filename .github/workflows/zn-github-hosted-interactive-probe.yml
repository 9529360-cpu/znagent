name: ZN GitHub-hosted Interactive Readiness Probe

on:
  push:
    branches:
      - ci/github-hosted-interactive-probe
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  hosted-interactive-probe:
    name: Hosted Windows full interactive product probe
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Hosted desktop probe requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "hosted_interactive_probe.runner=$env:RUNNER_NAME"

      - name: Checkout exact validated interactive source
        uses: actions/checkout@v7
        with:
          ref: 38a8d768c9a0b0c49a088c2c466a9956229d16dc
          fetch-depth: 1

      - name: Prove interactive desktop readiness
        run: |
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-zn-interactive-desktop-readiness.ps1" -ExpectedRunnerName $env:RUNNER_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove only the local runner-name diagnostic gate
        run: |
          $launcher = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\run-zn-interactive-python.ps1'
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $launcher)
          $guard = "if (`$env:RUNNER_NAME -and `$env:RUNNER_NAME -ne 'zn-interactive') {"
          $index = $lines.IndexOf($guard)
          if ($index -lt 0 -or $index + 2 -ge $lines.Count) {
            throw 'Expected exact zn-interactive runner-name guard was not found in the validated launcher.'
          }
          if ($lines[$index + 1] -notmatch 'Interactive Python launcher requires zn-interactive' -or $lines[$index + 2] -ne '}') {
            throw 'Validated launcher runner-name guard shape drifted; refusing diagnostic rewrite.'
          }
          $lines.RemoveRange($index, 3)
          [IO.File]::WriteAllLines($launcher, $lines, [Text.UTF8Encoding]::new($false))
          Write-Host "hosted_interactive_probe.removed_runner_name_guard=true"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false

      - name: Prepare isolated runtime and Chromium
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/hosted-interactive-probe-venv -ErrorAction SilentlyContinue
          uv venv .ci/hosted-interactive-probe-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\hosted-interactive-probe-venv\Scripts\python.exe'
          uv pip install --python $python "runtime/python[browser]"
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Playwright Chromium installation failed for hosted interactive probe.' }

      - name: Run all five E2E-13 cases in separate launcher lifecycles
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\hosted-interactive-probe-venv\Scripts\python.exe'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\run-zn-interactive-python.ps1'
          $testFile = 'tests/zn_agent/e2e/test_windows_interactive_current_app_content_cleanup.py'
          $cases = @(
            'WindowsInteractiveCurrentAppContentCleanupE2ETests.test_happy_path_real_winforms_valuepattern_save_and_fresh_new_window_readback',
            'WindowsInteractiveCurrentAppContentCleanupE2ETests.test_stale_edit_runtime_is_rejected_then_freshly_regrounded_before_mutation',
            'WindowsInteractiveCurrentAppContentCleanupE2ETests.test_content_drift_blocks_stale_transform_and_reinvestigates',
            'WindowsInteractiveCurrentAppContentCleanupE2ETests.test_ambiguous_same_named_edit_produces_zero_mutation',
            'WindowsInteractiveCurrentAppContentCleanupE2ETests.test_final_application_mismatch_does_not_complete'
          )
          foreach ($case in $cases) {
            Write-Host "=== hosted E2E-13 case: $case ==="
            & $launcher -Python $python -CommandArgs @($testFile, $case, '-v')
            if ($LASTEXITCODE -ne 0) { throw "Hosted E2E-13 failed: $case" }
          }

      - name: Run E2E-15 modal recovery acceptance in isolation
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\hosted-interactive-probe-venv\Scripts\python.exe'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\run-zn-interactive-python.ps1'
          & $launcher -Python $python -CommandArgs @(
            'tests/zn_agent/e2e/test_windows_interactive_desktop_modal_recovery.py',
            'WindowsInteractiveDesktopModalRecoveryE2ETests.test_unexpected_same_process_modal_is_safely_dismissed_then_original_work_regrounds',
            '-v'
          )
          if ($LASTEXITCODE -ne 0) { throw 'Hosted E2E-15 modal recovery acceptance failed.' }

      - name: Run all current product-route interactive modules
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\hosted-interactive-probe-venv\Scripts\python.exe'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\run-zn-interactive-python.ps1'
          $ownedRunner = Join-Path $env:GITHUB_WORKSPACE 'tests\zn_agent\e2e\_run_owned_unittest_module.py'
          $excluded = @(
            'test_windows_interactive_authorized_user_browser_cdp.py',
            'test_windows_interactive_user_browser_named_goal.py',
            'test_windows_interactive_desktop_modal_recovery.py',
            'test_windows_interactive_current_app_content_cleanup.py'
          )
          $tests = Get-ChildItem tests/zn_agent/e2e/test_windows_interactive_*.py |
            Where-Object { $_.Name -notin $excluded } |
            Sort-Object Name
          if (-not $tests) { throw 'No current product-route interactive E2E modules were discovered.' }
          foreach ($test in $tests) {
            Write-Host "=== hosted interactive module: $($test.Name) ==="
            & $launcher -Python $python -CommandArgs @($ownedRunner, $test.FullName)
            if ($LASTEXITCODE -ne 0) { throw "Hosted interactive module failed: $($test.Name)" }
          }
