name: Upstream Privacy Boundary Validation

on:
  push:
    branches:
      - work/remove-private-repo-runtime-identity

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated Python 3.12
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/upstream-privacy-venv -ErrorAction SilentlyContinue
          uv venv .ci/upstream-privacy-venv --python 3.12
      - name: Verify shipped source privacy boundary
        run: .\.ci\upstream-privacy-venv\Scripts\python.exe .agent/verify_zn_source_boundary.py
      - name: Compile changed resident owners
        run: |
          .\.ci\upstream-privacy-venv\Scripts\python.exe -m py_compile `
            runtime/python/zn_agent/core/maintenance_source.py `
            runtime/python/zn_agent/core/maintenance_repair.py `
            runtime/python/zn_agent/core/maintenance_publication.py `
            runtime/python/zn_agent/core/maintenance_attempt_lifecycle.py
      - name: Run source maintenance privacy regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/runtime/python
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          .\.ci\upstream-privacy-venv\Scripts\python.exe -B -m unittest -v `
            tests.zn_agent.core.test_maintenance_source_investigation `
            tests.zn_agent.core.test_resident_maintenance_source `
            tests.zn_agent.core.test_maintenance_isolated_repair `
            tests.zn_agent.core.test_maintenance_publication `
            tests.zn_agent.core.test_maintenance_attempt_lifecycle `
            tests.zn_agent.core.test_maintenance_review_recovery `
            tests.zn_agent.core.test_maintenance_semantic_independence
