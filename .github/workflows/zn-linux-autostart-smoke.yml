name: ZN Linux Autostart Smoke

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-linux-autostart-smoke.yml

permissions:
  actions: read
  contents: read
  statuses: write

env:
  CI: 'true'
  ZN_RELEASE_VERSION: '0.17.0'

jobs:
  autostart-diagnostic:
    name: Diagnose installed systemd user autostart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download previously built ZN deb only
        uses: actions/download-artifact@v4
        with:
          name: zn-linux-autostart-deb-9ee5dce043b8e6da79222102e34e140c26d10d95
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32592539845

      - name: Install deb
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find artifact -maxdepth 1 -type f -name '*.deb' -print -quit)"
          sudo apt-get update
          sudo apt-get install -y "./$deb"
          dpkg -L zn-desktop > installed-files.txt

      - name: Start user manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/$uid"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          [[ -S "$runtime_dir/bus" ]]
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"

      - name: Install autostart from packaged runtime and inspect failure
        shell: bash
        run: |
          set -euo pipefail
          runtime_manifest="$(grep '/resources/zn-runtime/runtime.json$' installed-files.txt | head -n 1)"
          embedded_python="$(python3 - "$runtime_manifest" <<'PY'
          import json
          import pathlib
          import sys
          manifest_path = pathlib.Path(sys.argv[1])
          manifest = json.loads(manifest_path.read_text())
          print((manifest_path.parent / manifest['python']).resolve())
          PY
          )"
          zn_home="$HOME/.local/share/zn-autostart-smoke"
          "$embedded_python" -I -m zn_agent.core.resident_autostart install --home "$zn_home"
          sleep 2
          echo '--- unit ---'
          cat "$HOME/.config/systemd/user/zn-resident.service"
          echo '--- systemctl status ---'
          systemctl --user status zn-resident.service --no-pager || true
          echo '--- systemctl properties ---'
          systemctl --user show zn-resident.service -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus -p ExecStart -p Environment -p FragmentPath --no-pager || true
          echo '--- journal ---'
          journalctl --user -u zn-resident.service -n 100 --no-pager || true
          echo '--- direct packaged launch sanity ---'
          direct_home="$HOME/.local/share/zn-autostart-direct"
          timeout 3 "$embedded_python" -I -m zn_agent.core.resident_server --home "$direct_home" || [[ $? == 124 ]]
          [[ -f "$direct_home/kernel/resident-endpoint.json" ]]
          systemctl --user is-active zn-resident.service

      - name: Publish Linux autostart diagnostic status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Linux Autostart Smoke',
              description: `installed systemd autostart diagnostic: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
