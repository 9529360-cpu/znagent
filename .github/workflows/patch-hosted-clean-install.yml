name: Temporary hosted clean-install patcher

on:
  push:
    branches:
      - ci/github-hosted-clean-install-full
    paths:
      - .github/workflows/patch-hosted-clean-install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Apply exact hosted clean-install patch
        run: python .github/scripts/patch-hosted-clean-install.py

      - name: Verify patch write set
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = ".github/workflows/zn-windows-clean-install.yml" || {
            echo "unexpected changed paths: $changed" >&2
            exit 1
          }
          git diff --check
          git diff --stat -- .github/workflows/zn-windows-clean-install.yml

      - name: Emit validated target blob
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          data = Path('.github/workflows/zn-windows-clean-install.yml').read_bytes()
          print('PATCHED_SHA256=' + hashlib.sha256(data).hexdigest())
          print('PATCHED_BASE64=' + base64.b64encode(data).decode('ascii'))
          PY
