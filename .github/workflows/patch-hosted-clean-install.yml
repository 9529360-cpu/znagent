name: Temporary hosted clean-install patcher

on:
  push:
    branches:
      - ci/github-hosted-clean-install-full
    paths:
      - .github/workflows/patch-hosted-clean-install.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Apply exact hosted clean-install patch
        run: python .github/scripts/patch-hosted-clean-install.py

      - name: Verify patch write set
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = ".github/workflows/zn-windows-clean-install.yml" || {
            echo "unexpected changed paths: $changed" >&2
            exit 1
          }
          git diff --check
          git diff --stat -- .github/workflows/zn-windows-clean-install.yml

      - name: Materialize validated Git blob without updating a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/blob.json"
          import base64
          import hashlib
          import json
          from pathlib import Path

          data = Path('.github/workflows/zn-windows-clean-install.yml').read_bytes()
          print('PATCHED_SHA256=' + hashlib.sha256(data).hexdigest(), flush=True)
          print(json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}))
          PY
          sha256="$(head -n 1 "$RUNNER_TEMP/blob.json" | cut -d= -f2)"
          tail -n +2 "$RUNNER_TEMP/blob.json" > "$RUNNER_TEMP/blob-request.json"
          response="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob-request.json")"
          blob="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test -n "$blob"
          echo "PATCHED_SHA256=$sha256"
          echo "PATCHED_GIT_BLOB=$blob"
