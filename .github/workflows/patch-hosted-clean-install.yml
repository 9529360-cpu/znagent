name: Temporary hosted clean-install patcher

on:
  push:
    branches:
      - ci/github-hosted-clean-install-full
    paths:
      - .github/workflows/patch-hosted-clean-install.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply exact hosted clean-install patch
        run: python .github/scripts/patch-hosted-clean-install.py

      - name: Verify patch write set
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = ".github/workflows/zn-windows-clean-install.yml" || {
            echo "unexpected changed paths: $changed" >&2
            exit 1
          }
          git diff --check
          git diff -- .github/workflows/zn-windows-clean-install.yml

      - name: Commit tested workflow patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/zn-windows-clean-install.yml
          git commit -m 'ci: run full clean install on disposable hosted Windows'
          git push origin HEAD:ci/github-hosted-clean-install-full
