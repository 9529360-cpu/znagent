name: ZN Skill Evals (Tier 1 + Tier 2)

# AS-4: deterministic Skill evals in CI — zero token, no model calls, no
# network. Tier 1 = structural validation of every skill file in the
# repo (checklist + intake + sections + links); Tier 2 = trigger
# validation through the real SkillRouter (positive quoted phrases route
# into top-k and activate, generic negatives match nothing, shared
# quoted trigger phrases are collisions).
#
# This workflow is a standalone CI check on PRs. It is NOT wired into
# the required-checks gate in zn-ci.yml — that file is intentionally
# untouched. Promoting this check to required is a separate
# branch-protection decision, not part of this PR.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-evals:
    name: ZN Skill Evals / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.6'
          enable-cache: true

      - name: Prepare Python 3.12 venv with ZN runtime deps
        run: |
          uv python install 3.12
          rm -rf .ci/evals-venv
          uv venv .ci/evals-venv --python 3.12
          uv pip install --python .ci/evals-venv/bin/python runtime/python

      - name: Run Skill evals over the repo
        run: |
          PYTHONPATH=runtime/python .ci/evals-venv/bin/python scripts/skill_evals.py

      - name: Run Skill evals unit tests
        run: |
          PYTHONPATH=runtime/python .ci/evals-venv/bin/python -m unittest discover -s tests/zn_agent/core -p "test_skill_evals.py" -v
