name: ZN Work Recovery E2E

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-work-recovery-e2e.yml
      - runtime/python/pyproject.toml
      - runtime/python/zn_agent/core/models.py
      - runtime/python/zn_agent/core/work.py
      - runtime/python/zn_agent/core/work_control.py
      - runtime/python/zn_agent/core/store.py
      - runtime/python/zn_agent/core/runtime.py
      - runtime/python/zn_agent/core/kernel_accounting.py
      - runtime/python/zn_agent/core/evolution.py
      - runtime/python/zn_agent/core/resident.py
      - runtime/python/zn_agent/core/embodied_resident.py
      - runtime/python/zn_agent/core/pointer_click_completion_resident.py
      - runtime/python/zn_agent/core/pointer_click_semantic_resident.py
      - runtime/python/zn_agent/core/completion_observation.py
      - runtime/python/zn_agent/core/event_outcome_nervous.py
      - runtime/python/zn_agent/core/intentional_resident.py
      - runtime/python/zn_agent/core/will.py
      - runtime/python/zn_agent/core/daemon.py
      - runtime/python/zn_agent/core/provider_bridge.py
      - runtime/python/zn_agent/core/capabilities.py
      - runtime/python/zn_agent/core/capability_recovery_resident.py
      - runtime/python/zn_agent/core/durable_body_accounting_resident.py
      - runtime/python/zn_agent/core/file_identity.py
      - runtime/python/zn_agent/core/overwrite_recovery_resident.py
      - runtime/python/zn_agent/core/recovery_control.py
      - runtime/python/zn_agent/core/recovery_bounded_resident.py
      - runtime/python/zn_agent/core/recovery_bounded_work.py
      - runtime/python/zn_agent/core/work_restore_point_resident.py
      - runtime/python/zn_agent/core/work_restore_point_inspection_resident.py
      - runtime/python/zn_agent/core/resident_accounting.py
      - runtime/python/zn_agent/core/focused_modern_text_resident.py
      - runtime/python/zn_agent/core/side_effect_attempts.py
      - runtime/python/zn_agent/core/side_effect_body.py
      - runtime/python/zn_agent/core/side_effect_journal.py
      - tests/zn_agent/core/test_completion_durability_boundaries.py
      - tests/zn_agent/core/test_completion_durability_secondary.py
      - tests/zn_agent/core/test_resident_native_completion_recovery.py
      - tests/zn_agent/core/test_capability_failure_recovery.py
      - tests/zn_agent/core/test_terminal_failure_recovery.py
      - tests/zn_agent/core/test_synchronous_recovery_control.py
      - tests/zn_agent/core/test_work_progress.py
      - tests/zn_agent/core/test_work_recovery.py
      - tests/zn_agent/core/test_body_accounting_recovery.py
      - tests/zn_agent/core/test_work_body_success_recovery.py
      - tests/zn_agent/core/test_work_pointer_completion_recovery.py
      - tests/zn_agent/core/test_work_ui_completion_recovery.py
      - tests/zn_agent/core/test_work_ingress_recovery.py
      - tests/zn_agent/core/test_work_ingress_checkpoint_recovery.py
      - tests/zn_agent/core/test_side_effect_attempt_persistence.py
      - tests/zn_agent/core/test_work_side_effect_recovery.py
      - tests/zn_agent/core/test_work_side_effect_resolution_recovery.py
      - tests/zn_agent/core/test_work_side_effect_observed_recovery.py
      - tests/zn_agent/core/test_work_overwrite_recovery.py
      - tests/zn_agent/core/test_work_restore_points.py
      - tests/zn_agent/core/test_work_restore_proposals.py
      - tests/zn_agent/core/test_work_restore_point_guards.py
      - tests/zn_agent/core/test_work_restore_point_retention.py
      - tests/zn_agent/core/test_work_restore_point_active_run.py
      - tests/zn_agent/core/test_work_cancellation.py
      - tests/zn_agent/core/test_work_cancel_control.py
      - tests/zn_agent/core/test_completion_observation_recovery.py
      - tests/zn_agent/core/test_completion_observation_embodied.py
      - tests/zn_agent/core/test_modern_text_resident_ownership.py
      - tests/zn_agent/core/test_event_outcome_nervous.py
      - tests/zn_agent/core/test_event_outcome_nervous_recovery.py
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-work-recovery-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  work-recovery:
    name: Windows resident Work restart recovery
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      ZN_AGENT_HOME: ${{ github.workspace }}/.ci/work-recovery-home
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Require Windows x64 headless CI runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN Work recovery E2E requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN Work recovery runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/work-recovery-venv -ErrorAction SilentlyContinue
          uv venv .ci/work-recovery-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\work-recovery-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Compile Work recovery path
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\work-recovery-venv\Scripts\python.exe'
          & $python -m py_compile runtime/python/zn_agent/core/models.py runtime/python/zn_agent/core/work.py runtime/python/zn_agent/core/work_control.py runtime/python/zn_agent/core/store.py runtime/python/zn_agent/core/runtime.py runtime/python/zn_agent/core/kernel_accounting.py runtime/python/zn_agent/core/evolution.py runtime/python/zn_agent/core/resident.py runtime/python/zn_agent/core/embodied_resident.py runtime/python/zn_agent/core/pointer_click_completion_resident.py runtime/python/zn_agent/core/pointer_click_semantic_resident.py runtime/python/zn_agent/core/completion_observation.py runtime/python/zn_agent/core/event_outcome_nervous.py runtime/python/zn_agent/core/intentional_resident.py runtime/python/zn_agent/core/will.py runtime/python/zn_agent/core/daemon.py runtime/python/zn_agent/core/provider_bridge.py runtime/python/zn_agent/core/capabilities.py runtime/python/zn_agent/core/capability_recovery_resident.py runtime/python/zn_agent/core/durable_body_accounting_resident.py runtime/python/zn_agent/core/file_identity.py runtime/python/zn_agent/core/overwrite_recovery_resident.py runtime/python/zn_agent/core/recovery_control.py runtime/python/zn_agent/core/recovery_bounded_resident.py runtime/python/zn_agent/core/recovery_bounded_work.py runtime/python/zn_agent/core/work_restore_point_resident.py runtime/python/zn_agent/core/work_restore_point_inspection_resident.py runtime/python/zn_agent/core/resident_accounting.py runtime/python/zn_agent/core/focused_modern_text_resident.py runtime/python/zn_agent/core/side_effect_attempts.py runtime/python/zn_agent/core/side_effect_body.py runtime/python/zn_agent/core/side_effect_journal.py
      - name: Verify durable Work progress and restart recovery
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\work-recovery-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.core.test_completion_durability_boundaries tests.zn_agent.core.test_completion_durability_secondary tests.zn_agent.core.test_resident_native_completion_recovery tests.zn_agent.core.test_capability_failure_recovery tests.zn_agent.core.test_terminal_failure_recovery tests.zn_agent.core.test_synchronous_recovery_control tests.zn_agent.core.test_work_progress tests.zn_agent.core.test_work_recovery tests.zn_agent.core.test_work_ingress_recovery tests.zn_agent.core.test_work_ingress_checkpoint_recovery tests.zn_agent.core.test_body_accounting_recovery tests.zn_agent.core.test_work_body_success_recovery tests.zn_agent.core.test_work_pointer_completion_recovery tests.zn_agent.core.test_work_ui_completion_recovery tests.zn_agent.core.test_side_effect_attempt_persistence tests.zn_agent.core.test_work_side_effect_recovery tests.zn_agent.core.test_work_side_effect_resolution_recovery tests.zn_agent.core.test_work_side_effect_observed_recovery tests.zn_agent.core.test_work_overwrite_recovery tests.zn_agent.core.test_work_restore_points tests.zn_agent.core.test_work_restore_proposals tests.zn_agent.core.test_work_restore_point_guards tests.zn_agent.core.test_work_restore_point_retention tests.zn_agent.core.test_work_restore_point_active_run tests.zn_agent.core.test_work_cancellation tests.zn_agent.core.test_work_cancel_control tests.zn_agent.core.test_completion_observation_recovery tests.zn_agent.core.test_completion_observation_embodied tests.zn_agent.core.test_modern_text_resident_ownership tests.zn_agent.core.test_event_outcome_nervous tests.zn_agent.core.test_event_outcome_nervous_recovery -v
