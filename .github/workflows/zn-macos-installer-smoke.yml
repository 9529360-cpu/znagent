name: ZN macOS Installer Smoke

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-macos-installer-smoke.yml
      - apps/desktop/scripts/stage-zn-runtime.mjs
      - apps/desktop/scripts/stage-zn-runtime.test.mjs
      - apps/desktop/scripts/verify-zn-packaged-runtime.mjs
      - apps/desktop/scripts/before-pack.mjs
      - apps/desktop/scripts/patch-electron-builder-mac-binary.mjs
      - apps/desktop/scripts/notarize.mjs
      - apps/desktop/electron-builder.zn.yml
      - apps/desktop/package.json
      - runtime/python/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: zn-macos-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      ZN_RELEASE_VERSION: '0.17.0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Stage self-contained ZN runtime
        env:
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build independent ZN desktop
        run: npm run build --workspace apps/desktop

      - name: Build macOS installer artifacts
        run: npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --mac dmg zip --publish never

      - name: Extract DMG and ZIP artifacts
        shell: bash
        run: |
          set -euo pipefail
          release="$GITHUB_WORKSPACE/apps/desktop/release"
          extract="$GITHUB_WORKSPACE/.ci/zn-macos-installers"
          dmg_payload="$extract/dmg-payload"
          zip_payload="$extract/zip-payload"
          mountpoint="$extract/dmg-mount"
          mkdir -p "$dmg_payload" "$zip_payload" "$mountpoint"

          dmg_count="$(find "$release" -maxdepth 1 -type f -name 'ZN-*.dmg' | wc -l | tr -d ' ')"
          zip_count="$(find "$release" -maxdepth 1 -type f -name 'ZN-*.zip' | wc -l | tr -d ' ')"
          if [[ "$dmg_count" != '1' ]]; then echo "expected one DMG, found $dmg_count"; exit 1; fi
          if [[ "$zip_count" != '1' ]]; then echo "expected one ZIP, found $zip_count"; exit 1; fi
          dmg="$(find "$release" -maxdepth 1 -type f -name 'ZN-*.dmg' -print -quit)"
          zip="$(find "$release" -maxdepth 1 -type f -name 'ZN-*.zip' -print -quit)"

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          ditto "$mountpoint/ZN.app" "$dmg_payload/ZN.app"
          hdiutil detach "$mountpoint"
          trap - EXIT

          ditto -x -k "$zip" "$zip_payload"

          echo "DMG: $dmg $(du -h "$dmg" | awk '{print $1}')"
          echo "ZIP: $zip $(du -h "$zip" | awk '{print $1}')"
          shasum -a 256 "$dmg" "$zip"

      - name: Verify macOS installer payloads
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.ci/zn-macos-installers"
          for payload in "$root/dmg-payload" "$root/zip-payload"; do
            app="$payload/ZN.app"
            plist="$app/Contents/Info.plist"
            executable="$app/Contents/MacOS/ZN"
            asar="$app/Contents/Resources/app.asar"
            runtime="$app/Contents/Resources/zn-runtime/runtime.json"

            [[ -x "$executable" ]] || { echo "ZN executable missing/not executable in $payload"; exit 1; }
            [[ -f "$asar" ]] || { echo "app.asar missing in $payload"; exit 1; }
            [[ -f "$runtime" ]] || { echo "zn-runtime manifest missing in $payload"; exit 1; }
            [[ ! -d "$app/Contents/Resources/zn-runtime/hermes_cli" ]] || { echo "forbidden hermes_cli in $payload"; exit 1; }

            bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$plist")"
            display_name="$(plutil -extract CFBundleDisplayName raw -o - "$plist")"
            bundle_name="$(plutil -extract CFBundleName raw -o - "$plist")"
            bundle_executable="$(plutil -extract CFBundleExecutable raw -o - "$plist")"
            [[ "$bundle_id" == 'ai.zn.desktop' ]] || { echo "unexpected CFBundleIdentifier: $bundle_id"; exit 1; }
            [[ "$display_name" == 'ZN' ]] || { echo "unexpected CFBundleDisplayName: $display_name"; exit 1; }
            [[ "$bundle_name" == 'ZN' ]] || { echo "unexpected CFBundleName: $bundle_name"; exit 1; }
            [[ "$bundle_executable" == 'ZN' ]] || { echo "unexpected CFBundleExecutable: $bundle_executable"; exit 1; }

            plist_json="$(plutil -convert json -o - "$plist")"
            node -e '
              const plist = JSON.parse(process.argv[1]);
              const schemes = (plist.CFBundleURLTypes || []).flatMap(item => item.CFBundleURLSchemes || []);
              if (schemes.length !== 1 || schemes[0] !== "zn") {
                throw new Error(`unexpected URL schemes: ${JSON.stringify(schemes)}`);
              }
            ' "$plist_json"

            node -e '
              const fs = require("fs");
              const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (manifest.product !== "ZN") throw new Error(`unexpected runtime product: ${manifest.product}`);
              if (manifest.platform !== "darwin") throw new Error(`unexpected runtime platform: ${manifest.platform}`);
            ' "$runtime"

            echo "Verified macOS payload at $payload"
            echo "  CFBundleIdentifier: $bundle_id"
            echo "  CFBundleExecutable: $bundle_executable"
            echo "  URL scheme: zn"
          done

      - name: Boot resident from extracted DMG
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs .ci/zn-macos-installers/dmg-payload "$ZN_RELEASE_VERSION" "$GITHUB_SHA"

      - name: Boot resident from extracted ZIP
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs .ci/zn-macos-installers/zip-payload "$ZN_RELEASE_VERSION" "$GITHUB_SHA"

      - name: Publish macOS installer smoke status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN macOS Installer Smoke',
              description: `DMG/ZIP payload identity + resident boot: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
