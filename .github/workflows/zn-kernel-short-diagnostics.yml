name: ZN Kernel Short Diagnostics

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-kernel-short-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home-short-diagnostics

jobs:
  short-kernel-diagnostics:
    name: Exact native body test isolation
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Require Windows x64 runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN kernel diagnostics require Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare isolated runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/runtime-short-diag -ErrorAction SilentlyContinue
          uv venv .ci/runtime-short-diag --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\runtime-short-diag\Scripts\python.exe'
          uv pip install --python $python runtime/python

      - name: Run exact previously interrupted test only
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & .\.ci\runtime-short-diag\Scripts\python.exe -m unittest tests.zn_agent.core.test_native_body.NativeBodyTests.test_resident_reports_changed_paths_from_its_git_body -v
