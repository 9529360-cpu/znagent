name: SM4 Publication Preparation Validation

on:
  push:
    branches:
      - work/sm4-publication-ready
    paths:
      - '.github/workflows/sm4-publication-preparation-validation.yml'
      - 'runtime/python/zn_agent/core/maintenance_publication.py'
      - 'runtime/python/zn_agent/core/cognitive_maintenance_resident.py'
      - 'tests/zn_agent/core/test_maintenance_publication.py'
      - 'tests/zn_agent/core/test_maintenance_publication_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home-sm4-publication

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  validate:
    name: SM4 publication preparation / Windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 25
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/sm4-publication-venv -ErrorAction SilentlyContinue
          uv venv .ci/sm4-publication-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-publication-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Compile publication modules
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-publication-venv\Scripts\python.exe'
          & $python -m py_compile runtime/python/zn_agent/core/maintenance_publication.py runtime/python/zn_agent/core/cognitive_maintenance_resident.py tests/zn_agent/core/test_maintenance_publication.py tests/zn_agent/core/test_maintenance_publication_diagnostic.py
      - name: Run direct publication diagnostic
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-publication-venv\Scripts\python.exe'
          $env:PYTHONPATH = (Join-Path $env:GITHUB_WORKSPACE 'runtime\python')
          & $python -m unittest -v tests.zn_agent.core.test_maintenance_publication_diagnostic.MaintenancePublicationDiagnostic.test_direct_preparation_surfaces_failure_step
      - name: Run publication and maintenance regressions
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm4-publication-venv\Scripts\python.exe'
          $env:PYTHONPATH = (Join-Path $env:GITHUB_WORKSPACE 'runtime\python')
          & $python -m unittest -v tests.zn_agent.core.test_maintenance_publication tests.zn_agent.core.test_maintenance_cognitive_repair tests.zn_agent.core.test_maintenance_attempt_lifecycle tests.zn_agent.core.test_maintenance_isolated_repair
