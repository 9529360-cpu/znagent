name: ZN Command Replanning E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/zn-command-replan-e2e.yml
      - runtime/python/zn_agent/core/broad_goal_coding_resident.py
      - runtime/python/zn_agent/core/broad_goal_recoverable_resident.py
      - runtime/python/zn_agent/core/broad_goal_work_resident.py
      - runtime/python/zn_agent/core/body.py
      - runtime/python/zn_agent/core/terminal.py
      - tests/zn_agent/core/test_broad_goal_terminal_repair.py
      - tests/zn_agent/core/test_e2e23_command_path_replan.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/zn-command-replan-e2e.yml
      - runtime/python/zn_agent/core/broad_goal_coding_resident.py
      - runtime/python/zn_agent/core/broad_goal_recoverable_resident.py
      - runtime/python/zn_agent/core/broad_goal_work_resident.py
      - runtime/python/zn_agent/core/body.py
      - runtime/python/zn_agent/core/terminal.py
      - tests/zn_agent/core/test_broad_goal_terminal_repair.py
      - tests/zn_agent/core/test_e2e23_command_path_replan.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zn-command-replan-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-replan:
    name: E2E-23 command replanning / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "E2E-23 requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/e2e23-venv -ErrorAction SilentlyContinue
          uv venv .ci/e2e23-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e23-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Run command-failure regression baseline
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e23-venv\Scripts\python.exe'
          & $python tests/zn_agent/core/test_broad_goal_terminal_repair.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run E2E-23 missing-path reality replanning
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\e2e23-venv\Scripts\python.exe'
          & $python tests/zn_agent/core/test_e2e23_command_path_replan.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
