name: Temporary Wave1 Activation Fixture Refresh

on:
  push:
    branches:
      - work/windows-companion-layer-wave1
    paths:
      - '.github/workflows/zz-wave1-activation-fixture-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/windows-companion-layer-wave1
          fetch-depth: 0
      - name: Patch activation fixture with explicit companion authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/zn_agent/core/test_application_window_activation.py')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {count}')
              text = text.replace(old, new)

          replace_exact(
              'from zn_agent.core.machine_capability import ApplicationInventoryCandidate, DeviceCapabilityGraph\n'
              'from zn_agent.core.provider_bridge import build_resident_runtime_from_existing_stack\n',
              'from zn_agent.core.device_capability_graph import DeviceCapabilityGraph\n'
              'from zn_agent.core.machine_capability import ApplicationInventoryCandidate\n'
              'from zn_agent.core.provider_bridge import build_resident_runtime_from_existing_stack\n'
              'from zn_agent.core.windows_companion_context import NativeWindowsCompanionContextSense\n',
              'imports',
          )

          replace_exact(
              '            cache_path=Path(tmp) / "apps.json", inventory_ttl_seconds=0,\n'
              '        )\n',
              '            cache_path=Path(tmp) / "apps.json", inventory_ttl_seconds=0,\n'
              '            companion_context_sense=NativeWindowsCompanionContextSense(\n'
              '                session_probe=lambda: {\n'
              '                    "platform_supported": True,\n'
              '                    "process_session_id": 3,\n'
              '                    "active_console_session_id": 3,\n'
              '                    "attached_to_active_console": True,\n'
              '                    "remote_session": False,\n'
              '                    "input_desktop_openable": True,\n'
              '                    "idle_seconds": 0.0,\n'
              '                },\n'
              '                power_probe=lambda: {\n'
              '                    "platform_supported": True,\n'
              '                    "ac_status": "online",\n'
              '                },\n'
              '                network_probe=lambda: {\n'
              '                    "platform_supported": True,\n'
              '                    "interface_count": 1,\n'
              '                    "up_interface_count": 1,\n'
              '                    "non_loopback_up_interface_count": 1,\n'
              '                    "has_non_loopback_address": True,\n'
              '                },\n'
              '            ),\n'
              '        )\n',
              'graph companion fixture',
          )

          replace_exact(
              '        resident.device_capabilities = graph\n'
              '        resident.body.device_capabilities = graph\n'
              '        return resident, application, executable\n',
              '        resident.device_capabilities = graph\n'
              '        resident.body.device_capabilities = graph\n'
              '        resident.body._current_session_connection_state = lambda _session_id: "active"\n'
              '        return resident, application, executable\n',
              'WTS fixture',
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/zn_agent/core/test_application_window_activation.py
      - name: Commit fixture repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/zz-wave1-activation-fixture-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/zn_agent/core/test_application_window_activation.py .github/workflows/zz-wave1-activation-fixture-refresh.yml
          git commit -m 'test: make activation companion preflight deterministic'
          git push origin HEAD:work/windows-companion-layer-wave1
