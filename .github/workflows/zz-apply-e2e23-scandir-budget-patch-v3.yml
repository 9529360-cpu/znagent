name: Align E2E-23 traversal documentation

on:
  push:
    branches:
      - work/e2e23-command-path-replan
    paths:
      - .github/workflows/zz-apply-e2e23-scandir-budget-patch-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Replace the stale os.walk wording exactly once
        run: |
          python -c "from pathlib import Path; p=Path('runtime/python/zn_agent/core/broad_goal_coding_resident.py'); s=p.read_text(encoding='utf-8'); old='before ``os.walk`` may descend through it.'; new='before explicit ``os.scandir`` traversal may descend through it.'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'runtime/python/zn_agent/core/broad_goal_coding_resident.py') {
            throw "Unexpected write set: $($changed -join ', ')"
          }
      - name: Commit and push documentation-only source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- runtime/python/zn_agent/core/broad_goal_coding_resident.py
          git commit -m 'docs: align stale-path traversal wording'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:work/e2e23-command-path-replan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
