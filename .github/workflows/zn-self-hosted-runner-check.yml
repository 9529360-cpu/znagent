name: ZN Self-Hosted Runner Check

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-self-hosted-runner-check.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: zn-self-hosted-runner-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-check:
    name: Self-hosted runner connectivity
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Publish runner check pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ZN Self-Hosted Runner',
              description: 'self-hosted runner accepted the job',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify repository checkout and report runner identity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const required = ['ZN.md', 'AGENTS.md', '.github/workflows/zn-ci.yml']
            for (const path of required) {
              if (!fs.existsSync(path)) throw new Error(`missing required repository path: ${path}`)
            }
            core.info(`runner.name=${process.env.RUNNER_NAME ?? 'unknown'}`)
            core.info(`runner.os=${process.env.RUNNER_OS ?? process.platform}`)
            core.info(`runner.arch=${process.env.RUNNER_ARCH ?? process.arch}`)
            core.info(`workspace=${process.env.GITHUB_WORKSPACE ?? process.cwd()}`)

      - name: Report runner lifecycle evidence
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows') {
            Write-Host "runner.lifecycle=non-windows"
            exit 0
          }

          $current = Get-Process -Id $PID
          Write-Host "job.shell.pid=$PID"
          Write-Host "job.shell.session_id=$($current.SessionId)"

          $listener = Get-CimInstance Win32_Process -Filter "Name = 'Runner.Listener.exe'" |
            Sort-Object CreationDate -Descending |
            Select-Object -First 1
          $worker = Get-CimInstance Win32_Process -Filter "Name = 'Runner.Worker.exe'" |
            Sort-Object CreationDate -Descending |
            Select-Object -First 1

          function Report-Process([string]$label, $process) {
            if ($null -eq $process) {
              Write-Host "$label.present=false"
              return
            }
            Write-Host "$label.present=true"
            Write-Host "$label.pid=$($process.ProcessId)"
            Write-Host "$label.ppid=$($process.ParentProcessId)"
            Write-Host "$label.created=$($process.CreationDate)"
            Write-Host "$label.path=$($process.ExecutablePath)"
            try {
              $native = Get-Process -Id $process.ProcessId -ErrorAction Stop
              Write-Host "$label.session_id=$($native.SessionId)"
            } catch {
              Write-Host "$label.session_id=unavailable"
            }
            if ($process.ParentProcessId) {
              $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)"
              if ($null -ne $parent) {
                Write-Host "$label.parent.name=$($parent.Name)"
                Write-Host "$label.parent.pid=$($parent.ProcessId)"
                Write-Host "$label.parent.ppid=$($parent.ParentProcessId)"
                Write-Host "$label.parent.created=$($parent.CreationDate)"
              } else {
                Write-Host "$label.parent.name=unavailable"
              }
            }
          }

          Report-Process 'runner.listener' $listener
          Report-Process 'runner.worker' $worker

          $services = @(Get-Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'actions.runner*' })
          Write-Host "runner.services.count=$($services.Count)"
          foreach ($service in $services) {
            Write-Host "runner.service.name=$($service.Name)"
            Write-Host "runner.service.status=$($service.Status)"
            Write-Host "runner.service.start_type=$($service.StartType)"
          }

      - name: Publish runner check terminal status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Self-Hosted Runner',
              description: `self-hosted runner check: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
