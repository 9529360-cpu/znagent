name: Local Documents and Spreadsheet Work E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-local-office-home
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-local-office-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-documents-spreadsheet:
    name: E2E-09-10 / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "E2E-09-10 requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Python 3.11-3.13 dependency and Office core compatibility
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          foreach ($version in @('3.11', '3.12', '3.13')) {
            uv python install $version
            $suffix = $version.Replace('.', '')
            $venv = Join-Path $env:GITHUB_WORKSPACE ".ci\local-office-$suffix"
            Remove-Item -Recurse -Force $venv -ErrorAction SilentlyContinue
            uv venv $venv --python $version
            $python = Join-Path $venv 'Scripts\python.exe'
            uv pip install --python $python runtime/python
            $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
            & $python -c "import sys, docx, openpyxl; assert sys.version_info[:2] == tuple(map(int, '$version'.split('.'))); assert docx.__version__ == '1.2.0'; assert openpyxl.__version__ == '3.1.5'"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python tests/zn_agent/core/test_office_document_work.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python tests/zn_agent/core/test_office_document_header_footer_work.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python tests/zn_agent/core/test_spreadsheet_work.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: E2E-09 real DOCX representative path
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\local-office-312\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_e2e09_find_yesterday_docx_and_edit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python tests/zn_agent/e2e/test_e2e09_header_footer_payment_date.py -v
      - name: E2E-10 zero-model real XLSX representative path
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\local-office-312\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_e2e10_spreadsheet_cleanup.py -v
      - name: Existing natural-file composition regression
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\local-office-312\Scripts\python.exe'
          & $python tests/zn_agent/core/test_natural_file_work.py -v
      - name: Existing Research Resident composition regression
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\local-office-312\Scripts\python.exe'
          & $python tests/zn_agent/core/test_research_information_resident.py -v
      - name: Existing Work recovery regression
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\local-office-312\Scripts\python.exe'
          & $python tests/zn_agent/core/test_work_recovery.py -v
