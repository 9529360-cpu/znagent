name: ZN Windows Clean Install

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/zn-windows-clean-install.yml'
      - '.github/scripts/invoke-zn-windows-installer.ps1'
      - '.github/scripts/test-zn-windows-installer-hang.ps1'
      - 'apps/desktop/**'
      - 'runtime/python/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/zn-windows-clean-install.yml'
      - '.github/scripts/invoke-zn-windows-installer.ps1'
      - '.github/scripts/test-zn-windows-installer-hang.ps1'
      - 'apps/desktop/**'
      - 'runtime/python/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-windows-clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    name: Windows x64 clean install and start
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Publish clean-install pending status
        uses: actions/github-script@v7
        with:
          script: |
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            for (const sha of statusShas) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'pending',
                context: 'ZN Windows Clean Install',
                description: 'isolated Windows x64 install/start proof: running',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
            }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify disposable GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Windows clean-install proof requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          $sessionId = (Get-Process -Id $PID -ErrorAction Stop).SessionId
          if ($sessionId -eq 0) {
            throw 'GitHub-hosted Windows clean-install proof requires a non-Session-0 user session.'
          }

          # This lane deliberately installs the production-identity artifact. Prove the disposable
          # hosted VM has no pre-existing ZN process, uninstall registration, or protocol identity
          # before dispatching the real installer so upgrade/uninstall state cannot contaminate the proof.
          $existingProcesses = @(Get-Process -Name 'ZN' -ErrorAction SilentlyContinue)
          if ($existingProcesses.Count -ne 0) {
            throw "Hosted clean-install runner already has $($existingProcesses.Count) ZN process(es); refusing to test against persistent host state."
          }
          $uninstallRoots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $existingInstalls = @(
            foreach ($root in $uninstallRoots) {
              Get-ItemProperty -Path $root -ErrorAction SilentlyContinue |
                Where-Object {
                  [string]$_.DisplayName -eq 'ZN' -or
                  [string]$_.DisplayIcon -like '*ZN.exe*'
                }
            }
          )
          if ($existingInstalls.Count -ne 0) {
            throw "Hosted clean-install runner already has $($existingInstalls.Count) ZN uninstall registration(s); refusing production-identity install."
          }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\zn') {
            throw 'Hosted clean-install runner already has a zn: protocol registration; refusing production-identity install.'
          }

          git config core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "failed to enable Git long-path cleanup with exit code $LASTEXITCODE" }
          Write-Host "Windows clean-install runner: $env:RUNNER_NAME session=$sessionId"
          Write-Host 'clean_install.preexisting_zn=false'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: runtime/python/pyproject.toml

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Test clean-install verifier contract
        run: |
          node --test apps/desktop/scripts/verify-zn-windows-clean-install.test.mjs
          node --test apps/desktop/scripts/verify-zn-windows-resident-autostart.test.mjs
          & "$env:GITHUB_WORKSPACE\.github\scripts\test-zn-windows-installer-hang.ps1"

      - name: Resolve candidate version
        id: version
        run: |
          $version = (node -p "require('./apps/desktop/package.json').version").Trim()
          if (-not $version) { throw 'desktop package version is empty' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Clean-install candidate version: $version"

      - name: Stage ZN-owned packaged runtime
        env:
          ZN_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build renderer and Electron runtime
        run: npm run build --workspace apps/desktop

      - name: Build unsigned Windows installer candidates from short path
        run: |
          $drive = 'Z:'
          if (Test-Path "$drive\") {
            throw "$drive is already in use; cannot create short build path"
          }
          & subst.exe $drive $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "subst failed with exit code $LASTEXITCODE" }
          try {
            Push-Location "$drive\apps\desktop"
            try {
              Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
              node scripts/run-electron-builder.mjs --config electron-builder.zn.yml --win --publish never
              if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            & subst.exe $drive /D
          }

      - name: Verify packaged runtime before install
        env:
          ZN_CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs apps/desktop/release $env:ZN_CANDIDATE_VERSION $env:GITHUB_SHA

      - name: Write and verify Windows release manifest
        env:
          ZN_CANDIDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node apps/desktop/scripts/write-zn-release-manifest.mjs windows $env:ZN_CANDIDATE_VERSION
          node apps/desktop/scripts/verify-zn-windows-release-candidate.mjs apps/desktop/release $env:ZN_CANDIDATE_VERSION x64

      - name: Install real NSIS candidate into isolated test state
        id: install
        run: |
          $manifest = Get-Content apps/desktop/release/zn-release-windows-x64.json -Raw | ConvertFrom-Json
          $exeAssets = @($manifest.assets | Where-Object { [IO.Path]::GetExtension($_.name).ToLowerInvariant() -eq '.exe' })
          if ($exeAssets.Count -ne 1) { throw "Expected exactly one EXE installer, got $($exeAssets.Count)" }
          $installer = (Resolve-Path (Join-Path 'apps/desktop/release' $exeAssets[0].name)).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'zn-clean-install-app'
          $znHome = Join-Path $env:RUNNER_TEMP 'zn-clean-install-home'
          Remove-Item -Recurse -Force $installDir,$znHome -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $znHome | Out-Null
          & "$env:GITHUB_WORKSPACE\.github\scripts\invoke-zn-windows-installer.ps1" `
            -InstallerPath $installer `
            -InstallerArguments "/S /D=$installDir" `
            -TimeoutSeconds 180 `
            -MaxDiagnosticProcesses 32
          $installedExe = Join-Path $installDir 'ZN.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw "ZN executable missing after real installer completed: $installedExe"
          }
          "install_dir=$installDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zn_home=$znHome" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installed isolated ZN at $installDir"

      - name: Start installed desktop and verify resident life
        env:
          ZN_INSTALL_DIR: ${{ steps.install.outputs.install_dir }}
          ZN_CLEAN_HOME: ${{ steps.install.outputs.zn_home }}
        run: |
          $env:ZN_AGENT_HOME = $env:ZN_CLEAN_HOME
          $env:ZN_HOME = $env:ZN_CLEAN_HOME
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $installedExe = Join-Path $env:ZN_INSTALL_DIR 'ZN.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'zn-clean-install-desktop.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'zn-clean-install-desktop.stderr.log'
          $proof = Join-Path $env:RUNNER_TEMP 'zn-clean-install-proof.log'
          $autostartProof = Join-Path $env:RUNNER_TEMP 'zn-resident-autostart-proof.log'
          $continuity = Join-Path $env:RUNNER_TEMP 'zn-installed-continuity-baseline.json'
          # Keep Electron's single-instance lock isolated from any accidental host state.
          $userDataDir = Join-Path $env:RUNNER_TEMP 'zn-clean-install-user-data'
          Remove-Item -Recurse -Force $userDataDir -ErrorAction SilentlyContinue
          Remove-Item -Force $continuity,$autostartProof,$stdout,$stderr,$proof -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $userDataDir | Out-Null
          $desktop = $null
          try {
            $desktop = Start-Process -FilePath $installedExe -ArgumentList '--disable-gpu', "--user-data-dir=$userDataDir" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            Start-Sleep -Seconds 2
            $desktop.Refresh()
            if ($desktop.HasExited) {
              Write-Host "Installed desktop exited before resident startup with code $($desktop.ExitCode)."
              if (Test-Path -LiteralPath $stdout) { Write-Host '--- desktop stdout ---'; Get-Content -LiteralPath $stdout -Tail 200 }
              if (Test-Path -LiteralPath $stderr) { Write-Host '--- desktop stderr ---'; Get-Content -LiteralPath $stderr -Tail 200 }
              throw "installed ZN exited before resident endpoint was created (exit $($desktop.ExitCode))"
            }

            # A clean packaged launch atomically materializes the full ZN-owned runtime, including
            # Chromium, into the persistent home before resident startup. On slower Windows disks
            # that copy can legitimately exceed the resident verifier's 60-second endpoint window.
            # Wait for the atomic final runtime manifest first; do not weaken the endpoint,
            # continuity, shutdown, or autostart proof that follows.
            $runtimeManifest = Join-Path $env:ZN_CLEAN_HOME "runtime/$env:GITHUB_SHA/runtime.json"
            $runtimeDeadline = (Get-Date).AddMinutes(5)
            $runtimeWaitStarted = Get-Date
            while ((Get-Date) -lt $runtimeDeadline) {
              if (Test-Path -LiteralPath $runtimeManifest -PathType Leaf) { break }
              $desktop.Refresh()
              if ($desktop.HasExited) {
                Write-Host "Installed desktop exited during runtime materialization with code $($desktop.ExitCode)."
                if (Test-Path -LiteralPath $stdout) { Write-Host '--- desktop stdout ---'; Get-Content -LiteralPath $stdout -Tail 200 }
                if (Test-Path -LiteralPath $stderr) { Write-Host '--- desktop stderr ---'; Get-Content -LiteralPath $stderr -Tail 200 }
                throw "installed ZN exited before runtime materialization completed (exit $($desktop.ExitCode))"
              }
              Start-Sleep -Seconds 2
            }
            if (-not (Test-Path -LiteralPath $runtimeManifest -PathType Leaf)) {
              $runtimeParent = Join-Path $env:ZN_CLEAN_HOME 'runtime'
              $partial = @()
              if (Test-Path -LiteralPath $runtimeParent -PathType Container) {
                $partial = @(Get-ChildItem -LiteralPath $runtimeParent -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like "$($env:GITHUB_SHA).tmp-*" } |
                  Select-Object -ExpandProperty Name)
              }
              Write-Host "Runtime materialization did not complete within 5 minutes; partial=$($partial -join ',')"
              if (Test-Path -LiteralPath $stdout) { Write-Host '--- desktop stdout ---'; Get-Content -LiteralPath $stdout -Tail 200 }
              if (Test-Path -LiteralPath $stderr) { Write-Host '--- desktop stderr ---'; Get-Content -LiteralPath $stderr -Tail 200 }
              throw "installed ZN runtime materialization timed out: $runtimeManifest"
            }
            $runtimeWaitSeconds = [int]((Get-Date) - $runtimeWaitStarted).TotalSeconds
            Write-Host "Installed runtime materialized after ${runtimeWaitSeconds}s: $runtimeManifest"

            $oldErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & node apps/desktop/scripts/verify-zn-windows-clean-install.mjs $env:ZN_INSTALL_DIR $env:ZN_CLEAN_HOME $env:GITHUB_SHA $continuity 2>&1 | Tee-Object -FilePath $proof
              $verifyExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $oldErrorActionPreference
            }
            if ($verifyExit -ne 0) {
              $desktop.Refresh()
              $desktopExitCode = if ($desktop.HasExited) { [string]$desktop.ExitCode } else { 'running' }
              Write-Host "Installed desktop state after verifier failure: exited=$($desktop.HasExited) exit_code=$desktopExitCode"
              if (Test-Path -LiteralPath $stdout) { Write-Host '--- desktop stdout ---'; Get-Content -LiteralPath $stdout -Tail 200 }
              if (Test-Path -LiteralPath $stderr) { Write-Host '--- desktop stderr ---'; Get-Content -LiteralPath $stderr -Tail 200 }
              if (Test-Path -LiteralPath $proof) { Write-Host '--- verifier proof ---'; Get-Content -LiteralPath $proof -Tail 200 }
              throw "clean-install verifier failed with exit code $verifyExit"
            }
          } finally {
            if ($desktop -and -not $desktop.HasExited) {
              Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path -LiteralPath $continuity -PathType Leaf)) {
            throw "Installed resident continuity baseline missing after proof: $continuity"
          }
          node apps/desktop/scripts/verify-zn-windows-resident-autostart.mjs $env:ZN_CLEAN_HOME $env:GITHUB_SHA $continuity 2>&1 | Tee-Object -FilePath $autostartProof
          if ($LASTEXITCODE -ne 0) { throw "resident autostart verifier failed with exit code $LASTEXITCODE" }
          $runtimeManifest = Join-Path $env:ZN_CLEAN_HOME "runtime/$env:GITHUB_SHA/runtime.json"
          if (-not (Test-Path -LiteralPath $runtimeManifest -PathType Leaf)) {
            throw "Materialized installed runtime manifest missing after proof: $runtimeManifest"
          }
          Copy-Item -LiteralPath $runtimeManifest -Destination (Join-Path $env:RUNNER_TEMP 'zn-clean-install-runtime.json') -Force

      - name: Upload verified Windows x64 main candidate
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: zn-windows-x64-verified-candidate-${{ steps.version.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/zn-release-windows-x64.json

      - name: Upload clean-install evidence when cloud storage is enabled
        if: ${{ always() && vars.ZN_ENABLE_CI_ARTIFACT_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zn-windows-clean-install-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/zn-clean-install-proof.log
            ${{ runner.temp }}/zn-resident-autostart-proof.log
            ${{ runner.temp }}/zn-clean-install-runtime.json
            ${{ runner.temp }}/zn-installed-continuity-baseline.json
            ${{ runner.temp }}/zn-clean-install-desktop.stdout.log
            ${{ runner.temp }}/zn-clean-install-desktop.stderr.log

      - name: Publish clean-install status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            for (const sha of statusShas) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'ZN Windows Clean Install',
                description: `isolated Windows x64 install/start proof: ${result}`.slice(0, 140),
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
            }