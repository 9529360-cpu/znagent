name: Export hosted Work Recovery workflow source

on:
  push:
    branches:
      - ci/github-hosted-work-recovery
    paths:
      - .github/workflows/zz-apply-work-recovery-hosted-patch.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate exact reviewed target text
        shell: powershell
        run: |
          $source = '.github/workflows/zn-work-recovery-e2e.yml'
          $content = Get-Content -LiteralPath $source -Raw
          $replacements = @(
            @('    runs-on: [self-hosted, Windows, X64, zn-ci]', '    runs-on: windows-latest'),
            @('      - name: Require Windows x64 headless CI runner', '      - name: Verify GitHub-hosted Windows x64 runner'),
            @('            throw "ZN Work recovery E2E requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"', '            throw "ZN Work recovery E2E requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"')
          )
          foreach ($pair in $replacements) {
            $old = $pair[0]
            $new = $pair[1]
            $count = ([regex]::Matches($content, [regex]::Escape($old))).Count
            if ($count -ne 1) {
              throw "Expected exactly one reviewed occurrence, found ${count}: $old"
            }
            $content = $content.Replace($old, $new)
          }
          if ($content.Contains('[self-hosted, Windows, X64, zn-ci]')) {
            throw 'Hosted Work Recovery target still contains the local zn-ci runner label.'
          }
          New-Item -ItemType Directory -Force -Path '.ci-generated' | Out-Null
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE '.ci-generated\zn-work-recovery-e2e.yml.txt'), $content, [Text.UTF8Encoding]::new($false))

      - name: Publish ordinary text output
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-generated/zn-work-recovery-e2e.yml.txt
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.ci-generated/zn-work-recovery-e2e.yml.txt') {
            throw "Unexpected staged write set: $($changed -join ', ')"
          }
          git commit -m 'ci: export hosted Work Recovery workflow source'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:ci/github-hosted-work-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
