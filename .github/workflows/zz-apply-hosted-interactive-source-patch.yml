name: Apply hosted interactive workflow migration

on:
  push:
    branches:
      - work/interactive-runner-readiness
    paths:
      - .github/workflows/zz-apply-hosted-interactive-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact hosted-runner migration
        run: |
          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          interactive = Path('.github/workflows/zn-windows-interactive-e2e.yml')
          text = interactive.read_text(encoding='utf-8').replace('\r\n', '\n')
          text = replace_once(
              text,
              '    runs-on: [self-hosted, Windows, X64, zn-interactive]\n',
              '    runs-on: windows-latest\n',
              'interactive runs-on',
          )
          text = replace_once(
              text,
              '      - name: Require Windows x64 interactive runner\n',
              '      - name: Verify GitHub-hosted Windows x64 runner\n',
              'interactive guard name',
          )
          text = replace_once(
              text,
              '            throw "ZN interactive desktop E2E requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"\n',
              '            throw "ZN interactive desktop E2E requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"\n',
              'interactive guard message',
          )
          text = replace_once(
              text,
              "          if ($env:RUNNER_NAME -ne 'zn-interactive') {\n            throw \"ZN interactive desktop E2E requires the dedicated zn-interactive runner; got $env:RUNNER_NAME\"\n          }\n",
              '',
              'interactive runner-name gate',
          )
          text = replace_once(
              text,
              '          & "$env:GITHUB_WORKSPACE\\.github\\scripts\\test-zn-interactive-desktop-readiness.ps1"\n',
              '          & "$env:GITHUB_WORKSPACE\\.github\\scripts\\test-zn-interactive-desktop-readiness.ps1" -ExpectedRunnerName $env:RUNNER_NAME\n',
              'interactive readiness invocation',
          )
          interactive.write_text(text, encoding='utf-8', newline='\n')

          readiness = Path('.github/workflows/zn-interactive-runner-readiness.yml')
          text = readiness.read_text(encoding='utf-8').replace('\r\n', '\n')
          text = replace_once(
              text,
              "  schedule:\n    - cron: '17 * * * *'\n",
              '',
              'hosted readiness schedule',
          )
          text = replace_once(
              text,
              '    runs-on: [self-hosted, Windows, X64, zn-interactive]\n',
              '    runs-on: windows-latest\n',
              'readiness runs-on',
          )
          text = replace_once(
              text,
              '      - name: Require dedicated Windows x64 runner\n',
              '      - name: Verify GitHub-hosted Windows x64 runner\n',
              'readiness guard name',
          )
          text = replace_once(
              text,
              "          if ($env:RUNNER_NAME -ne 'zn-interactive') {\n            throw \"Interactive readiness requires zn-interactive; got $env:RUNNER_NAME\"\n          }\n",
              '',
              'readiness runner-name gate',
          )
          text = replace_once(
              text,
              '          & "$env:GITHUB_WORKSPACE\\.github\\scripts\\test-zn-interactive-desktop-readiness.ps1"\n',
              '          & "$env:GITHUB_WORKSPACE\\.github\\scripts\\test-zn-interactive-desktop-readiness.ps1" -ExpectedRunnerName $env:RUNNER_NAME\n',
              'readiness invocation',
          )
          readiness.write_text(text, encoding='utf-8', newline='\n')

          for path in (interactive, readiness):
              current = path.read_text(encoding='utf-8')
              if '[self-hosted, Windows, X64, zn-interactive]' in current:
                  raise SystemExit(f'{path}: stale zn-interactive runs-on remains')
              if "RUNNER_NAME -ne 'zn-interactive'" in current:
                  raise SystemExit(f'{path}: stale static runner-name gate remains')
          '@ | Set-Content -LiteralPath .ci-hosted-interactive-workflow-patch.py -Encoding utf8
          python .ci-hosted-interactive-workflow-patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact write set and syntax
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $expected = @(
            '.github/workflows/zn-interactive-runner-readiness.yml',
            '.github/workflows/zn-windows-interactive-e2e.yml'
          )
          if ($changed.Count -ne $expected.Count) { throw "Unexpected write set: $($changed -join ', ')" }
          foreach ($path in $expected) {
            if ($path -notin $changed) { throw "Missing expected change: $path" }
          }

      - name: Commit and push hosted workflow changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/zn-interactive-runner-readiness.yml .github/workflows/zn-windows-interactive-e2e.yml
          git commit -m 'ci: run interactive acceptance on GitHub-hosted Windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:work/interactive-runner-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
