name: ZN Python Namespace Migration

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-python-namespace-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering dev revision
        uses: actions/checkout@v4
        with:
          ref: dev/zn-agent
          fetch-depth: 0

      - name: Require exact development branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "dev/zn-agent"
          git fetch origin dev/zn-agent
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev/zn-agent)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'

      - name: Migrate ZN tests and repository-owned verifier paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          old_tests = root / 'tests' / 'agent' / 'kernel'
          new_tests = root / 'tests' / 'zn_agent' / 'core'
          if not old_tests.is_dir():
              raise SystemExit('expected tests/agent/kernel to exist')
          if new_tests.exists():
              raise SystemExit('tests/zn_agent/core already exists')
          new_tests.parent.mkdir(parents=True, exist_ok=True)
          shutil.move(str(old_tests), str(new_tests))

          replacements = (
              ('tests/agent/kernel', 'tests/zn_agent/core'),
              ('agent/kernel', 'runtime/python/zn_agent/core'),
              ('agent.kernel', 'zn_agent.core'),
              ('REPO_ROOT / "agent" / "kernel"', 'REPO_ROOT / "runtime" / "python" / "zn_agent" / "core"'),
              ("REPO_ROOT / 'agent' / 'kernel'", "REPO_ROOT / 'runtime' / 'python' / 'zn_agent' / 'core'"),
          )
          for path in sorted(new_tests.rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          semantics = root / 'runtime' / 'python' / 'zn_agent' / 'core' / 'repo_test_semantics.py'
          text = semantics.read_text(encoding='utf-8')
          text = text.replace('tests/agent/kernel', 'tests/zn_agent/core')
          text = text.replace('agent/kernel', 'runtime/python/zn_agent/core')
          text = text.replace('agent.kernel', 'zn_agent.core')
          text = text.replace(
              '    "uv",\n    "run",\n    "python",',
              '    "python",',
          )
          text = text.replace('len(target.parts) != 3', 'len(target.parts) != 5')
          text = text.replace(
              'PurePosixPath(*target.parts[:2]) != ZN_KERNEL_SOURCE_DIR',
              'PurePosixPath(*target.parts[:4]) != ZN_KERNEL_SOURCE_DIR',
          )
          semantics.write_text(text, encoding='utf-8')

          workflow = root / '.github' / 'workflows' / 'zn-ci.yml'
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              '          cache-dependency-glob: |\n            uv.lock\n            runtime/python/pyproject.toml',
              '          cache-dependency-glob: runtime/python/pyproject.toml',
          )
          text = text.replace(
              '      - name: Install locked repository test dependencies\n        run: uv sync --frozen --extra dev\n\n',
              '',
          )
          text = text.replace(
              '      - name: Install isolated ZN runtime distribution\n        run: |\n          uv venv .ci/runtime-venv --python 3.12\n          uv pip install --python .ci/runtime-venv/bin/python runtime/python',
              '      - name: Install isolated ZN runtime distribution\n        run: |\n          uv venv .ci/runtime-venv --python 3.12\n          uv pip install --python .ci/runtime-venv/bin/python runtime/python\n          echo "$GITHUB_WORKSPACE/.ci/runtime-venv/bin" >> "$GITHUB_PATH"',
          )
          text = text.replace('.ci/runtime-venv/bin/python -I -', 'python -I -')
          text = text.replace(
              'run: uv run python -m compileall -q agent/kernel',
              'run: python -m compileall -q runtime/python/zn_agent/core',
          )
          text = text.replace(
              "run: uv run python -m unittest discover -s tests/agent/kernel -p 'test_*.py' -v",
              "run: python -m unittest discover -s tests/zn_agent/core -p 'test_*.py' -v",
          )
          workflow.write_text(text, encoding='utf-8')

          # The migration action is intentionally self-removing. It must never
          # become a standing source-mutation control plane.
          Path('.github/workflows/zn-python-namespace-migration.yml').unlink()
          PY

          rmdir tests/agent 2>/dev/null || true
          git diff --check
          ! grep -R --line-number --fixed-strings 'from agent.kernel' tests/zn_agent/core
          ! grep -R --line-number --fixed-strings 'import agent.kernel' tests/zn_agent/core

      - name: Install migrated ZN runtime
        shell: bash
        run: |
          set -euo pipefail
          uv venv .ci/runtime-venv --python 3.12
          uv pip install --python .ci/runtime-venv/bin/python runtime/python

      - name: Verify migrated ZN core and tests before commit
        shell: bash
        run: |
          set -euo pipefail
          .ci/runtime-venv/bin/python -I - <<'PY'
          import os
          from pathlib import Path
          from zn_agent.core.provider_bridge import build_resident_runtime
          home = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'zn-migration-smoke'
          home.mkdir(parents=True, exist_ok=True)
          resident = build_resident_runtime(config={'model': {}}, store_path=home / 'kernel.db')
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          resident.store.close()
          PY
          .ci/runtime-venv/bin/python -m compileall -q runtime/python/zn_agent/core
          .ci/runtime-venv/bin/python -m unittest discover -s tests/zn_agent/core -p 'test_*.py' -v

      - name: Commit verified mechanical migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: move ZN core tests to zn_agent namespace'
          git fetch origin dev/zn-agent
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev/zn-agent)"
          git push origin HEAD:dev/zn-agent
