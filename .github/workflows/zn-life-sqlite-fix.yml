name: ZN Life SQLite Fix

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-life-sqlite-fix.yml

permissions:
  contents: write
  statuses: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/zn-agent
          fetch-depth: 0

      - name: Apply deterministic connection lifecycle fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          life = Path('agent/kernel/life.py')
          text = life.read_text(encoding='utf-8')
          import_needle = 'import sqlite3\nimport time\n'
          if text.count(import_needle) != 1:
              raise SystemExit('unexpected life.py import shape')
          text = text.replace(
              import_needle,
              'import sqlite3\nimport time\nfrom contextlib import closing\n',
              1,
          )
          life.write_text(
              text.replace(
                  'with self._connect() as conn:',
                  'with closing(self._connect()) as conn:',
              ),
              encoding='utf-8',
          )
          if text.count('with self._connect() as conn:') != 13:
              raise SystemExit('unexpected life sqlite context count')

          stage = Path('apps/desktop/scripts/stage-zn-runtime.mjs')
          stage_text = stage.read_text(encoding='utf-8')
          old = (
              "// CPython reports its runtime root through site.getsitepackages(), while the\n"
              "// installed package lives under Lib/site-packages.\n"
          )
          new = (
              "// CPython's generic site-package discovery can report the runtime root, while\n"
              "// the installed package itself lives under Lib/site-packages.\n"
          )
          if stage_text.count(old) != 1:
              raise SystemExit('unexpected runtime staging comment shape')
          stage.write_text(stage_text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/agent/kernel/test_life_connection_lifecycle.py')
          if test_path.exists():
              raise SystemExit('life connection lifecycle test already exists')
          test_path.write_text('''from __future__ import annotations\n\nimport sqlite3\nimport tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\n\nfrom agent.kernel.provider_bridge import build_resident_runtime\n\n\nclass LifeConnectionLifecycleTests(unittest.TestCase):\n    def test_life_sqlite_connections_are_closed_after_pulse(self) -> None:\n        real_connect = sqlite3.connect\n        opened: list[sqlite3.Connection] = []\n\n        def tracking_connect(*args, **kwargs):\n            conn = real_connect(*args, **kwargs)\n            opened.append(conn)\n            return conn\n\n        with tempfile.TemporaryDirectory() as tmp:\n            with patch(\n                "agent.kernel.life.sqlite3.connect",\n                side_effect=tracking_connect,\n            ):\n                resident = build_resident_runtime(\n                    config={"model": {}},\n                    store_path=Path(tmp) / "kernel.db",\n                )\n                resident.pulse()\n                resident.life.snapshot()\n\n            self.assertGreater(len(opened), 0)\n            for conn in opened:\n                with self.assertRaises(sqlite3.ProgrammingError):\n                    conn.execute("SELECT 1")\n            resident.store.close()\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Verify exact diff
        shell: bash
        run: |
          set -euo pipefail
          git add -N tests/agent/kernel/test_life_connection_lifecycle.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --name-only | grep -Fx 'agent/kernel/life.py'
          git diff --name-only | grep -Fx 'apps/desktop/scripts/stage-zn-runtime.mjs'
          git diff --name-only | grep -Fx 'tests/agent/kernel/test_life_connection_lifecycle.py'
          test "$(grep -Fc 'with closing(self._connect()) as conn:' agent/kernel/life.py)" -eq 13
          test "$(grep -Fc 'with self._connect() as conn:' agent/kernel/life.py)" -eq 0

      - name: Commit fix to dev branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/kernel/life.py apps/desktop/scripts/stage-zn-runtime.mjs tests/agent/kernel/test_life_connection_lifecycle.py
          git commit -m 'fix: close resident life sqlite connections'
          git push origin HEAD:dev/zn-agent

      - name: Publish lifecycle-fix status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Life SQLite Fix',
              description: `deterministic life DB close: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
