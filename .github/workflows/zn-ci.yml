name: ZN CI

on:
  push:
    branches:
      - dev/zn-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: ZN Kernel / Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ZN home
        run: mkdir -p "$ZN_AGENT_HOME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Boot ZN without a model
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from agent.kernel.provider_bridge import build_resident_runtime_from_existing_stack

          home = Path(os.environ['ZN_AGENT_HOME'])
          home.mkdir(parents=True, exist_ok=True)
          resident = build_resident_runtime_from_existing_stack(
              config={'model': {}},
              store_path=home / 'kernel.db',
          )
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          resident.store.close()
          PY

      - name: Compile resident kernel
        run: uv run python -m compileall -q agent/kernel

      - name: Run ZN kernel tests
        run: uv run python -m unittest discover -s tests/agent/kernel -p 'test_*.py' -v

  desktop:
    name: Electron / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck Electron desktop
        run: npm run typecheck --workspace apps/desktop

  container:
    name: Container / Runtime Smoke
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: znagent-ci:dev
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Boot ZN inside container without a model
        run: |
          docker run --rm \
            --entrypoint python \
            -e CI=true \
            -e TZ=UTC \
            -e PYTHONUTF8=1 \
            -e PYTHONUNBUFFERED=1 \
            -e ZN_AGENT_HOME=/tmp/znagent-ci \
            znagent-ci:dev \
            -c "from pathlib import Path; from agent.kernel.provider_bridge import build_resident_runtime_from_existing_stack; p=Path('/tmp/znagent-ci'); p.mkdir(parents=True, exist_ok=True); r=build_resident_runtime_from_existing_stack(config={'model': {}}, store_path=p/'kernel.db'); pulse=r.pulse(); s=r.life.snapshot(); assert pulse.sequence >= 1 and s.body is not None and s.external_brains == (); r.store.close()"

  publish-status:
    name: Publish commit statuses
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - kernel
      - desktop
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish readable CI statuses
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (result) => {
              if (result === 'success') return 'success'
              if (result === 'failure') return 'failure'
              return 'error'
            }
            const rows = [
              ['ZN Kernel / Python', '${{ needs.kernel.result }}'],
              ['Electron / TypeScript', '${{ needs.desktop.result }}'],
            ]
            if (context.eventName !== 'push') {
              rows.push(['Container / Runtime Smoke', '${{ needs.container.result }}'])
            }
            for (const [statusContext, result] of rows) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: normalize(result),
                context: statusContext,
                description: `ZN CI: ${result}`.slice(0, 140),
              })
            }
