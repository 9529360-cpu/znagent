name: ZN CI

on:
  push:
    branches:
      - dev/zn-agent
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ci:
    name: ZN Windows CI / parallel lanes
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Publish pending lane statuses
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            for (const statusContext of ['ZN Source Boundary', 'ZN Kernel / Python', 'Electron / TypeScript']) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'pending',
                context: statusContext,
                description: 'ZN Windows CI: running',
                target_url: runUrl,
              })
            }

      - name: Require Windows x64 runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN steady-state CI requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'

      - name: Prepare shared Python 3.12
        shell: powershell
        run: uv python install 3.12

      - name: Run independent CI lanes concurrently on the Windows host
        id: parallel
        shell: powershell
        continue-on-error: true
        run: .\.github\scripts\run-zn-windows-ci-parallel.ps1

      - name: Publish terminal lane statuses
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          PARALLEL_OUTCOME: ${{ steps.parallel.outcome }}
        with:
          script: |
            const fs = require('node:fs')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const resultPath = '.ci/zn-ci-lane-results.json'
            let results = null
            try {
              results = JSON.parse(fs.readFileSync(resultPath, 'utf8'))
            } catch (error) {
              core.warning(`Unable to read ${resultPath}: ${error}`)
            }
            const fallback = process.env.PARALLEL_OUTCOME === 'success' ? 'success' : 'failure'
            const rows = [
              ['ZN Source Boundary', results?.['source-boundary'] ?? fallback],
              ['ZN Kernel / Python', results?.kernel ?? fallback],
              ['Electron / TypeScript', results?.desktop ?? fallback],
            ]
            for (const [statusContext, result] of rows) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: result === 'success' ? 'success' : 'failure',
                context: statusContext,
                description: `ZN Windows CI: ${result}`.slice(0, 140),
                target_url: runUrl,
              })
            }

      - name: Fail workflow when any parallel lane failed
        if: ${{ steps.parallel.outcome != 'success' }}
        shell: powershell
        run: throw "One or more ZN Windows CI lanes failed. See grouped lane output above."
