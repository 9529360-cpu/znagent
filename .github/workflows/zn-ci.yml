name: ZN CI

on:
  push:
    branches:
      - dev/zn-agent
      - main
      - work/desktop-task-resident-goal
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: ZN Source Boundary / Windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 10
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Publish source-boundary pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ZN Source Boundary',
              description: 'ZN Windows CI: running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Require Windows x64 headless CI runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN steady-state CI requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare unprivileged Python 3.12
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/source-venv -ErrorAction SilentlyContinue
          uv venv .ci/source-venv --python 3.12
      - name: Verify active tree is ZN-only
        run: .\.ci\source-venv\Scripts\python.exe .agent/verify_zn_source_boundary.py

  kernel:
    name: ZN Kernel / Python / Windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 25
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Publish kernel pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ZN Kernel / Python',
              description: 'ZN Windows CI: running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Require Windows x64 headless CI runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN steady-state CI requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/kernel-venv -ErrorAction SilentlyContinue
          uv venv .ci/kernel-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\kernel-venv\Scripts\python.exe'
          uv pip install --python $python "runtime/python[browser]"
      - name: Run kernel and resident tests
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & .\.ci\kernel-venv\Scripts\python.exe -m unittest discover -s tests/zn_agent/core -p 'test_*.py' -v
      - name: Smoke installed resident boot
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\kernel-venv\Scripts\python.exe'
          & $python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from zn_agent.core.provider_bridge import build_resident_runtime; import os; td=TemporaryDirectory(); r=build_resident_runtime(config={'model': {}}, store_path=Path(td.name) / 'kernel.db'); assert r.kernel.resources.routes == []; out=r.run_task('zero model boot'); assert out.model_invocations == 0; r.store.close(); td.cleanup(); print(out.reason)"

  electron:
    name: ZN Electron / Windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 15
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Publish electron pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ZN Electron',
              description: 'ZN Windows CI: running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
      - name: Require Windows x64 headless CI runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN steady-state CI requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck desktop
        run: npm run typecheck --workspace @zn/desktop
      - name: Bundle desktop
        run: npm run bundle --workspace @zn/desktop
      - name: Run desktop tests
        run: npm run test --workspace @zn/desktop
      - name: Run release/runtime script tests
        run: npm run test:release-scripts

  publish-status:
    name: Publish ZN CI status
    if: always()
    needs: [source-boundary, kernel, electron]
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 5
    steps:
      - name: Publish final status contexts
        uses: actions/github-script@v7
        with:
          script: |
            const states = {
              source: '${{ needs.source-boundary.result }}' === 'success' ? 'success' : 'failure',
              kernel: '${{ needs.kernel.result }}' === 'success' ? 'success' : 'failure',
              electron: '${{ needs.electron.result }}' === 'success' ? 'success' : 'failure',
            };
            for (const [context, state] of [
              ['ZN Source Boundary', states.source],
              ['ZN Kernel / Python', states.kernel],
              ['ZN Electron', states.electron],
            ]) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context,
                description: `ZN Windows CI: ${state}`,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }