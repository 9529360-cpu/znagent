name: ZN CI

on:
  push:
    branches:
      - dev/zn-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purge-hermes-source:
    name: One-shot final Hermes source evacuation
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact development revision
        uses: actions/checkout@v4
        with:
          ref: dev/zn-agent
          fetch-depth: 0

      - name: Require non-diverged dev HEAD
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "dev/zn-agent"
          git fetch origin dev/zn-agent
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev/zn-agent)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Apply ZN-only repository allowlist
        run: |
          set -euo pipefail
          python .agent/purge_hermes_source.py
          git diff --check
          test ! -d agent
          test ! -d hermes_cli
          test ! -d gateway
          test ! -d providers
          test ! -d plugins
          test ! -d tools
          test ! -d web
          test ! -d ui-tui
          test ! -d apps/shared
          test ! -d apps/web
          test ! -f pyproject.toml
          test ! -f uv.lock
          test ! -e .agent/purge_hermes_source.py
          ! grep -R --line-number --fixed-strings '@hermes/' apps runtime tests package.json 2>/dev/null
          ! grep -R --line-number --fixed-strings 'agent.kernel' apps runtime 2>/dev/null
          ! grep -R --line-number --fixed-strings 'from agent.kernel' tests 2>/dev/null
          ! grep -R --line-number --fixed-strings 'import agent.kernel' tests 2>/dev/null

      - name: Generate ZN-only Node lock and install from it
        run: |
          set -euo pipefail
          npm pkg set 'devDependencies.electron-builder-squirrel-windows=26.15.3' --workspace apps/desktop
          printf 'legacy-peer-deps=true\n' > .npmrc
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ls --all --legacy-peer-deps=false
          node -e "const p=require('./package-lock.json'); if (JSON.stringify(p).includes('@hermes/')) process.exit(1)"

      - name: Verify isolated ZN Python runtime and full core suite
        run: |
          set -euo pipefail
          uv venv .ci/purge-venv --python 3.12
          uv pip install --python .ci/purge-venv/bin/python runtime/python
          .ci/purge-venv/bin/python -I - <<'PY'
          import os
          from pathlib import Path
          from zn_agent.core.provider_bridge import build_resident_runtime

          home = Path(os.environ['ZN_AGENT_HOME']) / 'purge-runtime'
          home.mkdir(parents=True, exist_ok=True)
          resident = build_resident_runtime(config={'model': {}}, store_path=home / 'kernel.db')
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          resident.store.close()
          PY
          .ci/purge-venv/bin/python -m compileall -q runtime/python/zn_agent/core
          PYTHONPATH="$GITHUB_WORKSPACE/runtime/python" .ci/purge-venv/bin/python -m unittest discover -s tests/zn_agent/core -p 'test_*.py' -v

      - name: Verify ZN-only desktop build and tests
        run: |
          set -euo pipefail
          npm run typecheck --workspace apps/desktop
          node apps/desktop/scripts/bundle-electron-main.mjs --dev
          npm run test --workspace apps/desktop
          mapfile -t script_tests < <(find apps/desktop/scripts -maxdepth 1 -type f -name '*zn*.test.mjs' -print | sort)
          if (( ${#script_tests[@]} > 0 )); then
            node --test "${script_tests[@]}"
          fi

      - name: Verify ZN-only container runtime
        run: |
          set -euo pipefail
          docker build -t znagent-purge:dev .
          docker run --rm --entrypoint python \
            -e ZN_AGENT_HOME=/tmp/znagent-ci \
            znagent-purge:dev \
            -c "from pathlib import Path; from zn_agent.core.provider_bridge import build_resident_runtime; p=Path('/tmp/znagent-ci'); p.mkdir(parents=True, exist_ok=True); r=build_resident_runtime(config={'model': {}}, store_path=p/'kernel.db'); pulse=r.pulse(); s=r.life.snapshot(); assert pulse.sequence >= 1 and s.body is not None and s.external_brains == (); r.store.close()"

      - name: Commit only after deleted-tree verification
        run: |
          set -euo pipefail
          find runtime/python tests/zn_agent -type d -name __pycache__ -prune -exec rm -rf {} +
          find runtime/python tests/zn_agent -type f -name '*.pyc' -delete
          rm -f .npmrc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          while IFS=$'\t' read -r status path rest; do
            case "$status" in
              D*) continue ;;
            esac
            if [[ "$path" == .github/workflows/* ]]; then
              echo "refusing workflow addition/modification during purge: $status $path" >&2
              exit 1
            fi
            if [[ "$path" =~ (^|/)(__pycache__|node_modules|build|dist|release|\.ci)(/|$)|\.pyc$|\.db$ ]]; then
              echo "refusing generated artifact during purge: $status $path" >&2
              exit 1
            fi
          done < <(git diff --cached --name-status)
          git commit -m 'refactor: evacuate inherited Hermes source from ZN'
          git fetch origin dev/zn-agent
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/dev/zn-agent)"
          git push origin HEAD:dev/zn-agent

  kernel:
    name: ZN Kernel / Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare ZN home
        run: mkdir -p "$ZN_AGENT_HOME"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: runtime/python/pyproject.toml
      - name: Install isolated ZN runtime distribution
        run: |
          uv venv .ci/runtime-venv --python 3.12
          uv pip install --python .ci/runtime-venv/bin/python runtime/python
      - name: Boot isolated ZN distribution without a model
        run: |
          .ci/runtime-venv/bin/python -I - <<'PY'
          import os
          from pathlib import Path
          import zn_agent.resident
          from zn_agent.core.provider_bridge import build_resident_runtime
          home = Path(os.environ['ZN_AGENT_HOME']) / 'isolated-runtime'
          home.mkdir(parents=True, exist_ok=True)
          resident = build_resident_runtime(config={'model': {}}, store_path=home / 'kernel.db')
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          resident.store.close()
          PY
      - name: Compile resident core
        run: .ci/runtime-venv/bin/python -m compileall -q runtime/python/zn_agent/core
      - name: Run ZN core tests against working tree
        run: PYTHONPATH="$GITHUB_WORKSPACE/runtime/python" .ci/runtime-venv/bin/python -m unittest discover -s tests/zn_agent/core -p 'test_*.py' -v

  desktop:
    name: Electron / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck Electron desktop
        run: npm run typecheck --workspace apps/desktop
      - name: Bundle independent ZN desktop control plane
        run: node apps/desktop/scripts/bundle-electron-main.mjs --dev
      - name: Test ZN desktop ownership, packaged runtime, update and handoff contracts
        run: npm run test --workspace apps/desktop -- electron/zn-desktop-ownership.test.ts electron/zn-packaged-runtime.test.ts electron/zn-release-channel.test.ts electron/zn-resident-runtime-state.test.ts electron/zn-resident-application-handoff.test.ts electron/zn-resident-update-readiness.test.ts electron/zn-release-application-gate.test.ts
      - name: Test release-channel, runtime staging and packaged-artifact verifiers
        run: node --test apps/desktop/scripts/prepare-zn-public-channel.test.mjs apps/desktop/scripts/stage-zn-runtime.test.mjs apps/desktop/scripts/verify-zn-packaged-runtime.test.mjs

  container:
    name: Container / Runtime Smoke
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: znagent-ci:dev
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Boot ZN inside container without a model
        run: |
          docker run --rm --entrypoint python \
            -e CI=true \
            -e TZ=UTC \
            -e PYTHONUTF8=1 \
            -e PYTHONUNBUFFERED=1 \
            -e ZN_AGENT_HOME=/tmp/znagent-ci \
            znagent-ci:dev \
            -c "from pathlib import Path; from zn_agent.core.provider_bridge import build_resident_runtime; p=Path('/tmp/znagent-ci'); p.mkdir(parents=True, exist_ok=True); r=build_resident_runtime(config={'model': {}}, store_path=p/'kernel.db'); pulse=r.pulse(); s=r.life.snapshot(); assert pulse.sequence >= 1 and s.body is not None and s.external_brains == (); r.store.close()"

  publish-status:
    name: Publish commit statuses
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [kernel, desktop, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish readable CI statuses
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (result) => result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const rows = [
              ['ZN Kernel / Python', '${{ needs.kernel.result }}'],
              ['Electron / TypeScript', '${{ needs.desktop.result }}'],
            ]
            if (context.eventName !== 'push') rows.push(['Container / Runtime Smoke', '${{ needs.container.result }}'])
            for (const [statusContext, result] of rows) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: normalize(result),
                context: statusContext,
                description: `ZN CI: ${result}`.slice(0, 140),
                target_url: runUrl,
              })
            }
