name: ZN CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: ZN Source Boundary / Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Publish source-boundary pending status
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const statusContexts = ['ZN Source Boundary', 'ZN Source Boundary / Windows']
            for (const sha of statusShas) {
              for (const statusContext of statusContexts) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'pending',
                  context: statusContext,
                  description: 'ZN Windows CI: running',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                })
              }
            }
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN online CI requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.6'
          enable-cache: true
      - name: Prepare unprivileged Python 3.12
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/source-venv -ErrorAction SilentlyContinue
          uv venv .ci/source-venv --python 3.12
      - name: Verify active tree is ZN-only
        run: .\.ci\source-venv\Scripts\python.exe .agent/verify_zn_source_boundary.py

  kernel-tests:
    name: ZN Kernel / Python / Windows / shard ${{ matrix.label }} of 8
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: 1
          - shard: 1
            label: 2
          - shard: 2
            label: 3
          - shard: 3
            label: 4
          - shard: 4
            label: 5
          - shard: 5
            label: 6
          - shard: 6
            label: 7
          - shard: 7
            label: 8
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
      ZN_TEST_SHARD: ${{ matrix.shard }}
      ZN_TEST_SHARD_COUNT: '8'
    steps:
      - name: Publish kernel pending status
        if: ${{ matrix.shard == 0 }}
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const statusContexts = ['ZN Kernel / Python', 'ZN Kernel / Python / Windows']
            for (const sha of statusShas) {
              for (const statusContext of statusContexts) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'pending',
                  context: statusContext,
                  description: 'ZN Windows CI: running 8 parallel core-test shards',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                })
              }
            }
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN online CI requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.6'
          enable-cache: true
      - name: Prepare ZN home and isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/runtime-venv -ErrorAction SilentlyContinue
          uv venv .ci/runtime-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\runtime-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Boot isolated ZN distribution without a model
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\runtime-venv\Scripts\python.exe'
          @'
          import os
          from pathlib import Path
          import zn_agent.resident
          from zn_agent.core.provider_bridge import build_resident_runtime
          home = Path(os.environ['ZN_AGENT_HOME']) / 'isolated-runtime'
          home.mkdir(parents=True, exist_ok=True)
          resident = build_resident_runtime(config={'model': {}}, store_path=home / 'kernel.db')
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          resident.store.close()
          '@ | & $python -I -
      - name: Compile resident core
        run: .\.ci\runtime-venv\Scripts\python.exe -m compileall -q runtime/python/zn_agent/core
      - name: Run ZN core test shard
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\runtime-venv\Scripts\python.exe'
          @'
          import os
          import unittest
          from pathlib import Path

          shard = int(os.environ["ZN_TEST_SHARD"])
          shard_count = int(os.environ["ZN_TEST_SHARD_COUNT"])
          test_dir = Path("tests/zn_agent/core")
          files = sorted(test_dir.glob("test_*.py"))
          selected_files = [
              path
              for index, path in enumerate(files)
              if index % shard_count == shard
          ]
          if not selected_files:
              raise SystemExit(
                  f"ZN core shard {shard + 1}/{shard_count} selected no tests"
              )

          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite()
          for path in selected_files:
              suite.addTests(
                  loader.discover(
                      str(test_dir),
                      pattern=path.name,
                  )
              )
          print(
              f"ZN core shard {shard + 1}/{shard_count}: "
              f"{len(selected_files)} test files"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          '@ | & $python -

  kernel:
    name: ZN Kernel / Python / Windows
    if: ${{ always() }}
    needs: [kernel-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all parallel kernel shards
        shell: bash
        env:
          KERNEL_TESTS_RESULT: ${{ needs['kernel-tests'].result }}
        run: |
          if [ "$KERNEL_TESTS_RESULT" != "success" ]; then
            echo "Kernel shard matrix result: $KERNEL_TESTS_RESULT"
            exit 1
          fi
          echo "All eight ZN core-test shards passed."

  product-gate:
    name: ZN Product Contracts / gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.0'
      - name: Test product gate ownership and path matching
        shell: bash
        run: node --test .github/scripts/zn-product-required-gate.test.mjs
      - name: Test source bootstrap contracts
        shell: bash
        run: node --test scripts/zn-dev.test.mjs
      - name: Wait for required product contracts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/zn-product-required-gate.mjs

  publish-status-primary:
    name: Publish Windows CI statuses / primary
    if: ${{ always() }}
    needs: [source-boundary, kernel]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Publish readable CI statuses
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const normalize = (result) => result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const rows = [
              ['ZN Source Boundary', '${{ needs.source-boundary.result }}'],
              ['ZN Source Boundary / Windows', '${{ needs.source-boundary.result }}'],
              ['ZN Kernel / Python', '${{ needs.kernel.result }}'],
              ['ZN Kernel / Python / Windows', '${{ needs.kernel.result }}'],
            ]
            for (const sha of statusShas) {
              for (const [statusContext, result] of rows) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: normalize(result),
                  context: statusContext,
                  description: `ZN Windows CI: ${result}`.slice(0, 140),
                  target_url: runUrl,
                })
              }
            }

  publish-status-fallback:
    name: Publish Windows CI statuses / fallback
    if: ${{ always() }}
    needs: [source-boundary, kernel]
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Publish readable CI statuses
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const normalize = (result) => result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const rows = [
              ['ZN Source Boundary', '${{ needs.source-boundary.result }}'],
              ['ZN Source Boundary / Windows', '${{ needs.source-boundary.result }}'],
              ['ZN Kernel / Python', '${{ needs.kernel.result }}'],
              ['ZN Kernel / Python / Windows', '${{ needs.kernel.result }}'],
            ]
            for (const sha of statusShas) {
              for (const [statusContext, result] of rows) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: normalize(result),
                  context: statusContext,
                  description: `ZN Windows CI: ${result}`.slice(0, 140),
                  target_url: runUrl,
                })
              }
            }
