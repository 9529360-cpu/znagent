name: ZN CI

on:
  push:
    branches:
      - dev/zn-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: ZN Kernel / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Compile resident kernel
        run: uv run python -m compileall -q agent/kernel

      - name: Run ZN kernel tests
        run: uv run python -m unittest discover -s tests/agent/kernel -p 'test_*.py' -v

  desktop:
    name: Electron / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck Electron desktop
        run: npm run typecheck --workspace apps/desktop

  container:
    name: Container / Build and ZN Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: znagent-ci:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify ZN kernel inside container
        run: >-
          docker run --rm --entrypoint python znagent-ci:dev
          -c "from agent.kernel import ZNLifeCore, ZNResidentRuntime; print('ZN container kernel import OK')"

  publish-status:
    name: Publish commit statuses
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - kernel
      - desktop
      - container
    runs-on: ubuntu-latest
    steps:
      - name: Publish readable CI statuses
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (result) => {
              if (result === 'success') return 'success'
              if (result === 'failure') return 'failure'
              return 'error'
            }
            const rows = [
              ['ZN Kernel / Python 3.12', '${{ needs.kernel.result }}'],
              ['Electron / TypeScript', '${{ needs.desktop.result }}'],
              ['Container / Build and ZN Smoke Test', '${{ needs.container.result }}'],
            ]
            for (const [statusContext, result] of rows) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: normalize(result),
                context: statusContext,
                description: `ZN CI: ${result}`.slice(0, 140),
              })
            }
