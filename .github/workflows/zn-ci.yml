name: ZN CI

on:
  push:
    branches:
      - dev/zn-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

jobs:
  kernel:
    name: ZN Kernel / Reproducible Python Environment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ZN runtime directories
        run: mkdir -p "$ZN_AGENT_HOME"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libffi-dev \
            pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Report Python environment
        run: |
          python --version
          uv --version
          uv run python -c "import sys, sqlite3; print('executable:', sys.executable); print('sqlite:', sqlite3.sqlite_version)"
          uv run python -c "from agent.kernel.home import get_zn_home; print('ZN home:', get_zn_home())"

      - name: Boot ZN resident without any model
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path

          from agent.kernel.home import get_zn_home
          from agent.kernel.provider_bridge import build_resident_runtime_from_existing_stack

          expected = Path(os.environ['ZN_AGENT_HOME'])
          home = get_zn_home()
          assert home == expected, (home, expected)
          home.mkdir(parents=True, exist_ok=True)

          resident = build_resident_runtime_from_existing_stack(
              config={'model': {}},
              store_path=home / 'kernel.db',
          )
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          assert state.name
          print('ZN resident boot OK:', state.name, 'pulse', pulse.sequence)
          resident.store.close()
          PY

      - name: Compile resident kernel
        run: uv run python -m compileall -q agent/kernel

      - name: Run ZN kernel tests
        run: uv run python -m unittest discover -s tests/agent/kernel -p 'test_*.py' -v

  desktop:
    name: Electron / Locked Workspace Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Report Node environment
        run: |
          node --version
          npm --version

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck Electron desktop
        run: npm run typecheck --workspace apps/desktop

  container:
    name: Container / Runtime Environment Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Report Docker environment
        run: |
          docker version
          docker buildx version

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: znagent-ci:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime tools inside container
        run: |
          docker run --rm --entrypoint sh znagent-ci:dev -lc '
            python --version &&
            node --version &&
            npm --version &&
            git --version &&
            rg --version | head -n 1
          '

      - name: Boot ZN resident inside container without a model
        run: |
          docker run --rm \
            --entrypoint python \
            -e CI=true \
            -e TZ=UTC \
            -e PYTHONUTF8=1 \
            -e PYTHONUNBUFFERED=1 \
            -e ZN_AGENT_HOME=/tmp/znagent-ci \
            znagent-ci:dev \
            -c "from pathlib import Path; from agent.kernel.provider_bridge import build_resident_runtime_from_existing_stack; p=Path('/tmp/znagent-ci'); p.mkdir(parents=True, exist_ok=True); r=build_resident_runtime_from_existing_stack(config={'model': {}}, store_path=p/'kernel.db'); pulse=r.pulse(); s=r.life.snapshot(); assert pulse.sequence >= 1 and s.body is not None and s.external_brains == (); print('ZN container resident boot OK:', s.name, pulse.sequence); r.store.close()"

  publish-status:
    name: Publish commit statuses
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - kernel
      - desktop
      - container
    runs-on: ubuntu-latest
    steps:
      - name: Publish readable CI statuses
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (result) => {
              if (result === 'success') return 'success'
              if (result === 'failure') return 'failure'
              return 'error'
            }
            const rows = [
              ['ZN Kernel / Reproducible Python Environment', '${{ needs.kernel.result }}'],
              ['Electron / Locked Workspace Environment', '${{ needs.desktop.result }}'],
              ['Container / Runtime Environment Smoke Test', '${{ needs.container.result }}'],
            ]
            for (const [statusContext, result] of rows) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: normalize(result),
                context: statusContext,
                description: `ZN CI: ${result}`.slice(0, 140),
              })
            }
