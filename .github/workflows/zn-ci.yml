name: ZN CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

concurrency:
  group: zn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: ZN Source Boundary / Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Publish source-boundary pending status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const statusContexts = ['ZN Source Boundary', 'ZN Source Boundary / Windows']
            for (const sha of statusShas) {
              for (const statusContext of statusContexts) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'pending',
                  context: statusContext,
                  description: 'ZN Windows CI: running',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                })
              }
            }
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN online CI requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare unprivileged Python 3.12
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/source-venv -ErrorAction SilentlyContinue
          uv venv .ci/source-venv --python 3.12
      - name: Verify active tree is ZN-only
        run: .\.ci\source-venv\Scripts\python.exe .agent/verify_zn_source_boundary.py

  kernel:
    name: ZN Kernel / Python / Windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - name: Publish kernel pending status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const statusContexts = ['ZN Kernel / Python', 'ZN Kernel / Python / Windows']
            for (const sha of statusShas) {
              for (const statusContext of statusContexts) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'pending',
                  context: statusContext,
                  description: 'ZN Windows CI: running',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                })
              }
            }
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN online CI requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare ZN home and isolated runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/runtime-venv -ErrorAction SilentlyContinue
          uv venv .ci/runtime-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\runtime-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Boot isolated ZN distribution without a model
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\runtime-venv\Scripts\python.exe'
          @'
          import os
          from pathlib import Path
          import zn_agent.resident
          from zn_agent.core.provider_bridge import build_resident_runtime
          home = Path(os.environ['ZN_AGENT_HOME']) / 'isolated-runtime'
          home.mkdir(parents=True, exist_ok=True)
          resident = build_resident_runtime(config={'model': {}}, store_path=home / 'kernel.db')
          pulse = resident.pulse()
          state = resident.life.snapshot()
          assert pulse.sequence >= 1
          assert state.body is not None
          assert state.external_brains == ()
          resident.store.close()
          '@ | & $python -I -
      - name: Compile resident core
        run: .\.ci\runtime-venv\Scripts\python.exe -m compileall -q runtime/python/zn_agent/core
      - name: Run ZN core tests against working tree
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & .\.ci\runtime-venv\Scripts\python.exe -m unittest discover -s tests/zn_agent/core -p 'test_*.py' -v

  desktop:
    name: Electron / TypeScript / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Publish desktop pending status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const statusContexts = ['Electron / TypeScript', 'Electron / TypeScript / Windows']
            for (const sha of statusShas) {
              for (const statusContext of statusContexts) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'pending',
                  context: statusContext,
                  description: 'ZN Windows CI: running',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                })
              }
            }
      - name: Verify GitHub-hosted Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN online CI requires a GitHub-hosted Windows X64 runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "ZN CI runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high
      - name: Typecheck Electron desktop
        run: npm run typecheck --workspace apps/desktop
      - name: Bundle independent ZN desktop control plane
        run: node apps/desktop/scripts/bundle-electron-main.mjs --dev
      - name: Test ZN desktop ownership, delegated progress, restore inspection, packaged runtime, update and handoff contracts
        run: npm run test --workspace apps/desktop -- electron/zn-desktop-ownership.test.ts electron/zn-delegated-progress.test.ts electron/zn-delegated-progress-ui.test.ts electron/zn-restore-point-inspection.test.ts electron/zn-packaged-runtime.test.ts electron/zn-release-channel.test.ts electron/zn-resident-process.test.ts electron/zn-resident-runtime-state.test.ts electron/zn-resident-application-handoff.test.ts electron/zn-resident-update-readiness.test.ts electron/zn-release-application-gate.test.ts
      - name: Test release-channel, runtime staging and packaged-artifact verifiers
        run: node --test apps/desktop/scripts/prepare-zn-public-channel.test.mjs apps/desktop/scripts/stage-zn-runtime.test.mjs apps/desktop/scripts/verify-zn-packaged-runtime.test.mjs apps/desktop/scripts/verify-zn-windows-clean-install.test.mjs

  publish-status-primary:
    name: Publish Windows CI statuses / primary
    if: ${{ always() }}
    needs: [source-boundary, kernel, desktop]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Publish readable CI statuses
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (result) => result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const rows = [
              ['ZN Source Boundary', '${{ needs.source-boundary.result }}'],
              ['ZN Source Boundary / Windows', '${{ needs.source-boundary.result }}'],
              ['ZN Kernel / Python', '${{ needs.kernel.result }}'],
              ['ZN Kernel / Python / Windows', '${{ needs.kernel.result }}'],
              ['Electron / TypeScript', '${{ needs.desktop.result }}'],
              ['Electron / TypeScript / Windows', '${{ needs.desktop.result }}'],
            ]
            for (const sha of statusShas) {
              for (const [statusContext, result] of rows) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: normalize(result),
                  context: statusContext,
                  description: `ZN Windows CI: ${result}`.slice(0, 140),
                  target_url: runUrl,
                })
              }
            }

  publish-status-fallback:
    name: Publish Windows CI statuses / fallback
    if: ${{ always() }}
    needs: [source-boundary, kernel, desktop]
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Publish readable CI statuses
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const normalize = (result) => result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const statusShas = [...new Set([
              context.sha,
              context.payload.pull_request?.head?.sha,
            ].filter(Boolean))]
            const rows = [
              ['ZN Source Boundary', '${{ needs.source-boundary.result }}'],
              ['ZN Source Boundary / Windows', '${{ needs.source-boundary.result }}'],
              ['ZN Kernel / Python', '${{ needs.kernel.result }}'],
              ['ZN Kernel / Python / Windows', '${{ needs.kernel.result }}'],
              ['Electron / TypeScript', '${{ needs.desktop.result }}'],
              ['Electron / TypeScript / Windows', '${{ needs.desktop.result }}'],
            ]
            for (const sha of statusShas) {
              for (const [statusContext, result] of rows) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: normalize(result),
                  context: statusContext,
                  description: `ZN Windows CI: ${result}`.slice(0, 140),
                  target_url: runUrl,
                })
              }
            }
