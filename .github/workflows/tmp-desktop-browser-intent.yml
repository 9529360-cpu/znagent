name: Temporary Desktop Browser Intent

on:
  push:
    branches:
      - work/desktop-browser-intent

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare browser runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/browser-intent-venv -ErrorAction SilentlyContinue
          uv venv .ci/browser-intent-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\browser-intent-venv\Scripts\python.exe'
          Push-Location runtime/python
          try {
            uv pip install --python $python '.[browser]'
          } finally {
            Pop-Location
          }
          & $python -m playwright install chromium
      - name: Run user-entry and browser Work regressions
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\browser-intent-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.core.test_browser_work_user_entry tests.zn_agent.core.test_browser_work_navigation -v
      - name: Run real managed browser Work E2E
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\browser-intent-venv\Scripts\python.exe'
          & $python -m unittest tests.zn_agent.e2e.test_windows_managed_browser_work -v
