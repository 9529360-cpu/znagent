name: Temporary Work Cancel Recovery

on:
  push:
    branches:
      - work/work-cancel-recovery

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/work-cancel-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare runtime
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/work-cancel-venv -ErrorAction SilentlyContinue
          uv venv .ci/work-cancel-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\work-cancel-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Run Work cancellation recovery regressions
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & .\.ci\work-cancel-venv\Scripts\python.exe -m unittest tests.zn_agent.core.test_work_cancel_control tests.zn_agent.core.test_work_cancellation tests.zn_agent.core.test_synchronous_recovery_control -v
