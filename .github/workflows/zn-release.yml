name: ZN Release

# Windows is the only active ZN desktop release target for now.
# Linux/macOS release definitions are intentionally preserved for future work.
# They are skipped before runner allocation unless ZN_ENABLE_NON_WINDOWS_CI=true.
on:
  push:
    tags:
      - 'zn-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without publishing a GitHub Release
        required: true
        default: '0.17.0'
        type: string

permissions:
  contents: read

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096
  ZN_DESKTOP_UPDATE_CHANNEL_URL: ${{ vars.ZN_UPDATE_CHANNEL_URL }}

concurrency:
  group: zn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package ZN / Windows
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require dedicated interactive Windows x64 runner
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN Windows release requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -ne 'zn-interactive') {
            throw "ZN Windows release packaging requires the dedicated zn-interactive runner; got $env:RUNNER_NAME"
          }
          $sessionId = (Get-Process -Id $PID -ErrorAction Stop).SessionId
          if ($sessionId -eq 0) {
            throw 'ZN Windows release packaging requires a logged-on interactive session, not Session 0.'
          }
          git config core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw "failed to enable Git long-path cleanup with exit code $LASTEXITCODE" }
          Write-Host "ZN release packaging runner: $env:RUNNER_NAME session=$sessionId"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: runtime/python/pyproject.toml

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Resolve release version
        id: version
        env:
          ZN_RELEASE_INPUT_VERSION: ${{ inputs.version || '0.17.0' }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^zn-v', ''
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = [string]$env:ZN_RELEASE_INPUT_VERSION
            $tag = ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "invalid desktop version: $version"
          }
          node -e "const fs=require('node:fs'); const p='apps/desktop/package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\\n','utf8')" $version
          if ($LASTEXITCODE -ne 0) { throw "failed to stage desktop version $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Require public update channel for formal tags
        if: ${{ github.ref_type == 'tag' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZN_DESKTOP_UPDATE_CHANNEL_URL)) {
            throw 'Set repository variable ZN_UPDATE_CHANNEL_URL to the public ZN stable.json endpoint before publishing a formal tag.'
          }
          node -e "const raw=process.env.ZN_DESKTOP_UPDATE_CHANNEL_URL; const url=new URL(raw); if(url.protocol!=='https:' || !url.pathname.endsWith('/stable.json')) throw new Error('ZN_UPDATE_CHANNEL_URL must be an HTTPS URL ending in /stable.json')"
          if ($LASTEXITCODE -ne 0) { throw 'invalid ZN update channel URL' }

      - name: Stage ZN-owned packaged runtime
        env:
          ZN_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build renderer and Electron runtime
        run: npm run build --workspace apps/desktop

      - name: Build ZN Windows installer artifacts from short path
        run: |
          $drive = 'Z:'
          if (Test-Path "$drive\") {
            throw "$drive is already in use; cannot create short build path"
          }
          & subst.exe $drive $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "subst failed with exit code $LASTEXITCODE" }
          try {
            Push-Location "$drive\apps\desktop"
            try {
              Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
              node scripts/run-electron-builder.mjs --config electron-builder.zn.yml --win --publish never
              if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            & subst.exe $drive /D
          }

      - name: Verify runtime inside packaged Windows app
        env:
          ZN_RELEASE_VERSION_RESOLVED: ${{ steps.version.outputs.version }}
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs apps/desktop/release $env:ZN_RELEASE_VERSION_RESOLVED $env:GITHUB_SHA

      - name: Write Windows release asset manifest
        env:
          ZN_RELEASE_VERSION_RESOLVED: ${{ steps.version.outputs.version }}
          ZN_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node apps/desktop/scripts/write-zn-release-manifest.mjs windows $env:ZN_RELEASE_VERSION_RESOLVED $env:ZN_RELEASE_TAG

      - name: Upload packaged Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zn-desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/zn-release-windows-*.json
          retention-days: 14

  package-non-windows:
    name: Dormant package ZN / ${{ matrix.label }}
    if: ${{ vars.ZN_ENABLE_NON_WINDOWS_CI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            builder_target: linux
            manifest_platform: linux
          - label: macOS
            os: macos-14
            builder_target: mac
            manifest_platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: runtime/python/pyproject.toml

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#zn-v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version || '0.17.0' }}"
            TAG=""
          fi
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs')
          const version = process.argv[2]
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`invalid desktop version: ${version}`)
          }
          const path = 'apps/desktop/package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.version = version
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8')
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage ZN-owned packaged runtime
        env:
          ZN_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build renderer and Electron runtime
        run: npm run build --workspace apps/desktop

      - name: Build dormant platform installer artifacts
        run: npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --${{ matrix.builder_target }} --publish never

      - name: Verify runtime inside packaged app
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs apps/desktop/release "${{ steps.version.outputs.version }}" "${{ github.sha }}"

      - name: Write release asset manifest
        run: node apps/desktop/scripts/write-zn-release-manifest.mjs ${{ matrix.manifest_platform }} "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}"

      - name: Upload dormant platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zn-desktop-${{ matrix.manifest_platform }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/zn-release-*.json
          retention-days: 14

  package-status:
    name: Publish Windows package status
    if: ${{ always() }}
    needs: package-windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish package verification status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.package-windows.result }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Release Package / Windows',
              description: `ZN Windows release package: ${result}`.slice(0, 140),
              target_url: runUrl,
            })

  publish:
    name: Publish ZN Windows Release Channel
    if: ${{ startsWith(github.ref, 'refs/tags/zn-v') }}
    needs: package-windows
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: zn-desktop-windows
          path: dist

      - name: Prepare public update-channel bundle
        env:
          ZN_PUBLIC_RELEASE_URL: ${{ vars.ZN_PUBLIC_RELEASE_URL }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^zn-v', ''
          node apps/desktop/scripts/prepare-zn-public-channel.mjs dist $version public-channel

      - name: Upload public-channel audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: zn-public-channel-${{ github.ref_name }}
          if-no-files-found: error
          path: public-channel/**
          retention-days: 30

      - name: Publish immutable update assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ZN_UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZN_UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.ZN_UPDATE_S3_REGION || 'us-east-1' }}
          AWS_EC2_METADATA_DISABLED: 'true'
          ZN_UPDATE_S3_BUCKET: ${{ vars.ZN_UPDATE_S3_BUCKET }}
          ZN_UPDATE_S3_ENDPOINT: ${{ vars.ZN_UPDATE_S3_ENDPOINT }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^zn-v', ''
          if ([string]::IsNullOrWhiteSpace($env:ZN_UPDATE_S3_BUCKET) -or [string]::IsNullOrWhiteSpace($env:AWS_ACCESS_KEY_ID) -or [string]::IsNullOrWhiteSpace($env:AWS_SECRET_ACCESS_KEY)) {
            throw 'Configure ZN update S3 credentials before formal release.'
          }
          $args = @('s3', 'cp', "public-channel/releases/$version/", "s3://$env:ZN_UPDATE_S3_BUCKET/releases/$version/", '--recursive', '--cache-control', 'public,max-age=31536000,immutable', '--only-show-errors')
          if ($env:ZN_UPDATE_S3_ENDPOINT) { & aws --endpoint-url $env:ZN_UPDATE_S3_ENDPOINT @args } else { & aws @args }
          if ($LASTEXITCODE -ne 0) { throw "immutable release asset upload failed with exit code $LASTEXITCODE" }

      - name: Create release and upload archival Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^zn-v', ''
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/* --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG dist/* --repo $env:GITHUB_REPOSITORY --title "ZN $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed with exit code $LASTEXITCODE" }

      - name: Advance stable update channel last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ZN_UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZN_UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.ZN_UPDATE_S3_REGION || 'us-east-1' }}
          AWS_EC2_METADATA_DISABLED: 'true'
          ZN_UPDATE_S3_BUCKET: ${{ vars.ZN_UPDATE_S3_BUCKET }}
          ZN_UPDATE_S3_ENDPOINT: ${{ vars.ZN_UPDATE_S3_ENDPOINT }}
        run: |
          $args = @('s3', 'cp', 'public-channel/stable.json', "s3://$env:ZN_UPDATE_S3_BUCKET/stable.json", '--content-type', 'application/json', '--cache-control', 'no-cache, max-age=0', '--only-show-errors')
          if ($env:ZN_UPDATE_S3_ENDPOINT) { & aws --endpoint-url $env:ZN_UPDATE_S3_ENDPOINT @args } else { & aws @args }
          if ($LASTEXITCODE -ne 0) { throw "stable update channel upload failed with exit code $LASTEXITCODE" }
