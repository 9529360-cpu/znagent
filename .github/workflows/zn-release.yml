name: ZN Release

on:
  push:
    tags:
      - 'zn-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without publishing a GitHub Release
        required: true
        default: '0.17.0'
        type: string

permissions:
  contents: write
  statuses: write

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096
  ZN_DESKTOP_UPDATE_CHANNEL_URL: ${{ vars.ZN_UPDATE_CHANNEL_URL }}

concurrency:
  group: zn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ZN / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runs_on: [self-hosted, Linux]
            builder_target: linux
            manifest_platform: linux
          - label: Windows
            runs_on: [self-hosted, Windows, X64, zn-ci]
            builder_target: win
            manifest_platform: windows
          - label: macOS
            runs_on: [self-hosted, macOS]
            builder_target: mac
            manifest_platform: macos
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    steps:
      - name: Report self-hosted release runner
        shell: bash
        run: |
          set -euo pipefail
          echo "release.runner.name=${RUNNER_NAME:-unknown}"
          echo "release.runner.os=${RUNNER_OS:-unknown}"
          echo "release.runner.arch=${RUNNER_ARCH:-unknown}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: runtime/python/pyproject.toml

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#zn-v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="${{ inputs.version || '0.17.0' }}"
            TAG=""
          fi
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs')
          const version = process.argv[2]
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`invalid desktop version: ${version}`)
          }
          const path = 'apps/desktop/package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.version = version
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8')
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Require public update channel for formal tags
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          if [[ -z "$ZN_DESKTOP_UPDATE_CHANNEL_URL" ]]; then
            echo "::error::Set repository variable ZN_UPDATE_CHANNEL_URL to the public ZN stable.json endpoint before publishing a formal tag."
            exit 1
          fi
          node - <<'NODE'
          const raw = process.env.ZN_DESKTOP_UPDATE_CHANNEL_URL
          const url = new URL(raw)
          if (url.protocol !== 'https:' || !url.pathname.endsWith('/stable.json')) {
            throw new Error('ZN_UPDATE_CHANNEL_URL must be an HTTPS URL ending in /stable.json')
          }
          NODE

      - name: Stage ZN-owned packaged runtime
        env:
          ZN_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build renderer and Electron runtime
        run: npm run build --workspace apps/desktop

      - name: Build ZN installer artifacts
        run: npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --${{ matrix.builder_target }} --publish never

      - name: Verify runtime inside packaged app
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs apps/desktop/release "${{ steps.version.outputs.version }}" "${{ github.sha }}"

      - name: Write release asset manifest
        run: node apps/desktop/scripts/write-zn-release-manifest.mjs ${{ matrix.manifest_platform }} "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zn-desktop-${{ matrix.manifest_platform }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/zn-release-*.json
          retention-days: 14

  package-status:
    name: Publish multi-OS package status
    if: ${{ always() }}
    needs: package
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 5
    steps:
      - name: Publish package verification status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.package.result }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Release Package / multi-OS',
              description: `ZN release package: ${result}`.slice(0, 140),
              target_url: runUrl,
            })

  publish:
    name: Publish ZN Release Channel
    if: ${{ startsWith(github.ref, 'refs/tags/zn-v') }}
    needs: package
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare public update-channel bundle
        env:
          ZN_PUBLIC_RELEASE_URL: ${{ vars.ZN_PUBLIC_RELEASE_URL }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#zn-v}"
          node apps/desktop/scripts/prepare-zn-public-channel.mjs dist "$VERSION" public-channel

      - name: Upload public-channel audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: zn-public-channel-${{ github.ref_name }}
          if-no-files-found: error
          path: public-channel/**
          retention-days: 30

      - name: Publish immutable update assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ZN_UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZN_UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.ZN_UPDATE_S3_REGION || 'us-east-1' }}
          AWS_EC2_METADATA_DISABLED: 'true'
          ZN_UPDATE_S3_BUCKET: ${{ vars.ZN_UPDATE_S3_BUCKET }}
          ZN_UPDATE_S3_ENDPOINT: ${{ vars.ZN_UPDATE_S3_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#zn-v}"
          if [[ -z "$ZN_UPDATE_S3_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Configure ZN_UPDATE_S3_BUCKET and ZN_UPDATE_S3_ACCESS_KEY_ID / ZN_UPDATE_S3_SECRET_ACCESS_KEY before formal release."
            exit 1
          fi
          aws --version
          if [[ -n "$ZN_UPDATE_S3_ENDPOINT" ]]; then
            AWS=(aws --endpoint-url "$ZN_UPDATE_S3_ENDPOINT")
          else
            AWS=(aws)
          fi
          "${AWS[@]}" s3 cp "public-channel/releases/$VERSION/" "s3://$ZN_UPDATE_S3_BUCKET/releases/$VERSION/" \
            --recursive \
            --cache-control 'public,max-age=31536000,immutable' \
            --only-show-errors

      - name: Create release and upload archival installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${TAG#zn-v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZN $VERSION" \
              --generate-notes
          fi

      - name: Advance stable update channel last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ZN_UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZN_UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.ZN_UPDATE_S3_REGION || 'us-east-1' }}
          AWS_EC2_METADATA_DISABLED: 'true'
          ZN_UPDATE_S3_BUCKET: ${{ vars.ZN_UPDATE_S3_BUCKET }}
          ZN_UPDATE_S3_ENDPOINT: ${{ vars.ZN_UPDATE_S3_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ZN_UPDATE_S3_ENDPOINT" ]]; then
            AWS=(aws --endpoint-url "$ZN_UPDATE_S3_ENDPOINT")
          else
            AWS=(aws)
          fi
          "${AWS[@]}" s3 cp public-channel/stable.json "s3://$ZN_UPDATE_S3_BUCKET/stable.json" \
            --content-type 'application/json' \
            --cache-control 'no-cache, max-age=0' \
            --only-show-errors
