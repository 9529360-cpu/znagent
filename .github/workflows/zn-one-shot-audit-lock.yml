name: ZN One-shot Audited Lockfile Repair
on:
  push:
    branches:
      - "work/audit-high-transitives-20261012"
    paths:
      - ".github/workflows/zn-one-shot-audit-lock.yml"

permissions:
  contents: write

jobs:
  refresh-audited-lockfile:
    if: github.repository == '9529360-cpu/znagent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Repair locked transitive dependencies and prove clean high-severity audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --audit-level=high --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [key, item] of Object.entries(after.packages)) {
            const old = before.packages[key];
            if (item.version !== old?.version) {
              console.log('AUDIT_LOCK_CHANGE', JSON.stringify({path:key,from:old?.version ?? null,to:item.version,integrity:item.integrity ?? null}));
            }
          }
          NODE
          git rm .github/workflows/zn-one-shot-audit-lock.yml
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No locked dependencies changed, refusing an empty repair."
            exit 1
          fi
          git config user.name 'ZN CI Lockfile Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: refresh vulnerable npm transitive dependencies'
          git push origin HEAD:refs/heads/work/audit-high-transitives-20261012
