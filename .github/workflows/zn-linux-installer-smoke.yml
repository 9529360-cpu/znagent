name: ZN Linux Installer Smoke

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-linux-installer-smoke.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: zn-linux-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      ZN_RELEASE_VERSION: '0.17.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install RPM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm2cpio cpio

      - name: Stage self-contained ZN runtime
        env:
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build independent ZN desktop
        run: npm run build --workspace apps/desktop

      - name: Build Linux installer artifacts
        run: npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --linux AppImage deb rpm --publish never

      - name: Extract real installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$GITHUB_WORKSPACE/apps/desktop/release"
          EXTRACT="$GITHUB_WORKSPACE/.ci/zn-linux-installers"
          mkdir -p "$EXTRACT/appimage" "$EXTRACT/deb" "$EXTRACT/rpm"

          mapfile -t APPIMAGES < <(find "$RELEASE" -maxdepth 1 -type f -name '*.AppImage' -print)
          mapfile -t DEBS < <(find "$RELEASE" -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t RPMS < <(find "$RELEASE" -maxdepth 1 -type f -name '*.rpm' -print)
          test "${#APPIMAGES[@]}" -eq 1
          test "${#DEBS[@]}" -eq 1
          test "${#RPMS[@]}" -eq 1

          APPIMAGE="${APPIMAGES[0]}"
          DEB="${DEBS[0]}"
          RPM="${RPMS[0]}"
          chmod +x "$APPIMAGE"
          (
            cd "$EXTRACT/appimage"
            "$APPIMAGE" --appimage-extract >/dev/null
          )
          dpkg-deb -x "$DEB" "$EXTRACT/deb"
          (
            cd "$EXTRACT/rpm"
            rpm2cpio "$RPM" | cpio -idm --quiet
          )

          printf '%s\n' 'Built installer artifacts:'
          sha256sum "$APPIMAGE" "$DEB" "$RPM"
          ls -lh "$APPIMAGE" "$DEB" "$RPM"

      - name: Verify installed package shape
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.ci/zn-linux-installers"
          for FORMAT in appimage deb rpm; do
            DIR="$ROOT/$FORMAT"
            test "$(find "$DIR" -type f -path '*/resources/app.asar' | wc -l)" -ge 1
            test "$(find "$DIR" -type f -path '*/resources/zn-runtime/runtime.json' | wc -l)" -ge 1
            test "$(find "$DIR" -type f -name ZN -perm /111 | wc -l)" -ge 1
            test "$(find "$DIR" -path '*/resources/install-stamp.json' | wc -l)" -eq 0
            test "$(find "$DIR" -type d -path '*/zn-runtime/python/site-packages/hermes_cli' | wc -l)" -eq 0
          done

      - name: Boot resident from every extracted installer
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs .ci/zn-linux-installers "$ZN_RELEASE_VERSION" "$GITHUB_SHA"

      - name: Publish Linux installer smoke status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Linux Installer Smoke',
              description: `AppImage/deb/rpm extracted resident boot: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
