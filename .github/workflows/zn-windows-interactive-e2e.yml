permissions:
  contents: read

concurrency:
  group: zn-windows-interactive-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactive-desktop-e2e:
    name: Windows interactive product E2E
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Require Windows x64 interactive runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN interactive desktop E2E requires a Windows X64 self-hosted runner; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -ne 'zn-interactive') {
            throw "ZN interactive desktop E2E requires the dedicated zn-interactive runner; got $env:RUNNER_NAME"
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        shell: powershell
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/interactive-e2e-venv -ErrorAction SilentlyContinue
          uv venv .ci/interactive-e2e-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-e2e-venv\Scripts\python.exe'
          uv pip install --python $python "runtime/python[browser]"
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) {
            throw 'Playwright Chromium runtime installation failed for interactive E2E'
          }
      - name: Run E2E-13 current-app content cleanup
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-e2e-venv\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_windows_interactive_current_app_content_cleanup.py -v
          if ($LASTEXITCODE -ne 0) {
            throw 'E2E-13 current-app content cleanup failed'
          }
      - name: Run E2E-15 modal recovery acceptance in isolation
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-e2e-venv\Scripts\python.exe'
          & $python tests/zn_agent/e2e/test_windows_interactive_desktop_modal_recovery.py WindowsInteractiveDesktopModalRecoveryE2ETests.test_unexpected_same_process_modal_is_safely_dismissed_then_original_work_regrounds -v
          if ($LASTEXITCODE -ne 0) {
            throw 'E2E-15 isolated modal recovery acceptance failed'
          }
      - name: Run current product-route interactive E2Es in isolated modules
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-e2e-venv\Scripts\python.exe'
          $ownedRunner = Join-Path $env:GITHUB_WORKSPACE 'tests\zn_agent\e2e\_run_owned_unittest_module.py'
          $excluded = @(
            'test_windows_interactive_authorized_user_browser_cdp.py',
            'test_windows_interactive_user_browser_named_goal.py',
            'test_windows_interactive_desktop_modal_recovery.py',
            'test_windows_interactive_current_app_content_cleanup.py'
          )
          $tests = Get-ChildItem tests/zn_agent/e2e/test_windows_interactive_*.py |
            Where-Object { $_.Name -notin $excluded } |
            Sort-Object Name
          if (-not $tests) {
            throw 'No current product-route interactive E2E modules were discovered'
          }
          foreach ($test in $tests) {
            Write-Host "=== interactive module: $($test.Name) ==="
            & $python $ownedRunner $test.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Interactive E2E module failed: $($test.Name)"
            }
          }

  legacy-interactive-diagnostics:
    name: Legacy/full interactive diagnostics
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [interactive-desktop-e2e]
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 20
    env:
      CI: 'true'
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Require Windows x64 interactive runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN full interactive diagnostics require Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -ne 'zn-interactive') {
            throw "ZN full interactive diagnostics require zn-interactive; got $env:RUNNER_NAME"
          }
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare isolated runtime
        shell: powershell
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/interactive-diagnostics-venv -ErrorAction SilentlyContinue
          uv venv .ci/interactive-diagnostics-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\interactive-diagnostics-venv\Scripts\python.exe'
          uv pip install --python $python "runtime/python[browser]"
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) {
            throw 'Playwright Chromium runtime installation failed for interactive diagnostics'
          }
      - name: Run full interactive diagnostic suite including legacy paths
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & .\.ci\interactive-diagnostics-venv\Scripts\python.exe -m unittest discover -s tests/zn_agent/e2e -p 'test_windows_interactive_*.py' -v