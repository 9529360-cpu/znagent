name: ZN Windows Installer Smoke

on:
  push:
    branches:
      - dev/zn-agent
    paths:
      - .github/workflows/zn-windows-installer-smoke.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: zn-windows-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      ZN_RELEASE_VERSION: '0.17.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Stage self-contained ZN runtime
        env:
          ZN_RELEASE_COMMIT: ${{ github.sha }}
        run: node apps/desktop/scripts/stage-zn-runtime.mjs

      - name: Build independent ZN desktop
        run: npm run build --workspace apps/desktop

      - name: Build Windows installer artifacts
        run: npm run builder --workspace apps/desktop -- --config electron-builder.zn.yml --win nsis msi --publish never

      - name: Extract NSIS and MSI artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\release'
          $extract = Join-Path $env:GITHUB_WORKSPACE '.ci\zn-windows-installers'
          $nsisOuter = Join-Path $extract 'nsis-outer'
          $nsisPayload = Join-Path $extract 'nsis-payload'
          $msiPayload = Join-Path $extract 'msi-payload'
          New-Item -ItemType Directory -Force -Path $nsisOuter, $nsisPayload, $msiPayload | Out-Null

          $nsis = @(Get-ChildItem -Path $release -File -Filter 'ZN-*.exe')
          $msi = @(Get-ChildItem -Path $release -File -Filter 'ZN-*.msi')
          if ($nsis.Count -ne 1) { throw "expected one NSIS installer, found $($nsis.Count)" }
          if ($msi.Count -ne 1) { throw "expected one MSI installer, found $($msi.Count)" }

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x $nsis[0].FullName "-o$nsisOuter" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to extract NSIS installer: $LASTEXITCODE" }
          $appArchives = @(Get-ChildItem -Path $nsisOuter -Recurse -File -Filter 'app-*.7z')
          if ($appArchives.Count -ne 1) { throw "expected one app payload archive in NSIS installer, found $($appArchives.Count)" }
          & $sevenZip x $appArchives[0].FullName "-o$nsisPayload" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to extract NSIS app payload: $LASTEXITCODE" }

          & msiexec.exe /a $msi[0].FullName /qn "TARGETDIR=$msiPayload"
          if ($LASTEXITCODE -ne 0) { throw "msiexec administrative extraction failed: $LASTEXITCODE" }

          Write-Host "NSIS: $($nsis[0].FullName) $([math]::Round($nsis[0].Length / 1MB, 1)) MB"
          Write-Host "MSI:  $($msi[0].FullName) $([math]::Round($msi[0].Length / 1MB, 1)) MB"
          Get-FileHash -Algorithm SHA256 $nsis[0].FullName, $msi[0].FullName | Format-Table -AutoSize

      - name: Verify Windows installer payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE '.ci\zn-windows-installers'
          $payloads = @(
            (Join-Path $root 'nsis-payload'),
            (Join-Path $root 'msi-payload')
          )

          foreach ($payload in $payloads) {
            $exe = @(Get-ChildItem -Path $payload -Recurse -File -Filter 'ZN.exe')
            $asar = @(Get-ChildItem -Path $payload -Recurse -File -Filter 'app.asar')
            $runtime = @(Get-ChildItem -Path $payload -Recurse -File -Filter 'runtime.json' | Where-Object { $_.FullName -match '[\\/]zn-runtime[\\/]runtime\.json$' })
            $forbidden = @(Get-ChildItem -Path $payload -Recurse -Directory -Filter 'hermes_cli' -ErrorAction SilentlyContinue)
            if ($exe.Count -lt 1) { throw "ZN.exe missing from $payload" }
            if ($asar.Count -lt 1) { throw "app.asar missing from $payload" }
            if ($runtime.Count -ne 1) { throw "expected one zn-runtime manifest in $payload, found $($runtime.Count)" }
            if ($forbidden.Count -ne 0) { throw "forbidden hermes_cli found in $payload" }

            $info = $exe[0].VersionInfo
            if ($info.ProductName -ne 'ZN') { throw "unexpected ProductName in $($exe[0].FullName): $($info.ProductName)" }
            if ($info.FileDescription -ne 'ZN') { throw "unexpected FileDescription in $($exe[0].FullName): $($info.FileDescription)" }
            if ($info.CompanyName -ne 'ZN Project') { throw "unexpected CompanyName in $($exe[0].FullName): $($info.CompanyName)" }
            Write-Host "Verified Windows payload at $payload"
            Write-Host "  executable: $($exe[0].FullName)"
            Write-Host "  ProductName: $($info.ProductName)"
            Write-Host "  CompanyName: $($info.CompanyName)"
            Write-Host "  runtime: $($runtime[0].FullName)"
          }

      - name: Boot resident from both extracted installers
        run: node apps/desktop/scripts/verify-zn-packaged-runtime.mjs .ci/zn-windows-installers "$env:ZN_RELEASE_VERSION" "$env:GITHUB_SHA"

      - name: Publish Windows installer smoke status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}'
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'ZN Windows Installer Smoke',
              description: `NSIS/MSI extracted resident boot: ${result}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
