name: SM3 Isolated Repair Validation

on:
  push:
    branches:
      - work/sm3-isolated-repair

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 15
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare Python
        run: |
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/sm3-venv -ErrorAction SilentlyContinue
          uv venv .ci/sm3-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm3-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Compile affected resident modules
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm3-venv\Scripts\python.exe'
          & $python -m py_compile runtime/python/zn_agent/core/maintenance_repair.py runtime/python/zn_agent/core/health_aware_resident.py
      - name: Run SM3 targeted regressions
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\sm3-venv\Scripts\python.exe'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & $python -m unittest -v tests.zn_agent.core.test_maintenance_isolated_repair tests.zn_agent.core.test_maintenance_source_investigation tests.zn_agent.core.test_resident_maintenance_source tests.zn_agent.core.test_maintenance_investigation_lifecycle tests.zn_agent.core.test_resident_maintenance_status
