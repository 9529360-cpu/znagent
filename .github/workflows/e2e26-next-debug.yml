name: E2E26 Next Debug

on:
  push:
    branches:
      - debug/e2e26-next
  workflow_dispatch:

env:
  CI: 'true'
  TZ: UTC
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  ZN_AGENT_HOME: ${{ github.workspace }}/.ci/zn-home

defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  debug:
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 8
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ci/uv-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Prepare runtime
        run: |
          New-Item -ItemType Directory -Force -Path $env:ZN_AGENT_HOME | Out-Null
          uv python install 3.12
          Remove-Item -Recurse -Force .ci/debug-venv -ErrorAction SilentlyContinue
          uv venv .ci/debug-venv --python 3.12
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\debug-venv\Scripts\python.exe'
          uv pip install --python $python runtime/python
      - name: Run composed broad-goal regressions
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.ci\debug-venv\Scripts\python.exe'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'runtime\python'
          & $python -m unittest `
            tests.zn_agent.core.test_broad_goal_research_layer `
            tests.zn_agent.core.test_broad_goal_terminal_repair -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
import tempfile
from pathlib import Path
from zn_agent.core.broad_goal_research_resident import BroadGoalResearchResidentRuntime
from zn_agent.core.provider_bridge import build_resident_runtime
with tempfile.TemporaryDirectory() as tmp:
    resident = build_resident_runtime(config={"model": {}}, store_path=Path(tmp) / "kernel.db")
    try:
        assert isinstance(resident, BroadGoalResearchResidentRuntime), type(resident)
    finally:
        resident.store.close()
'@ | & $python -
