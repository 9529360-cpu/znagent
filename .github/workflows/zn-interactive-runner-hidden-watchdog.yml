name: ZN Interactive Runner Recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/zn-interactive-runner-hidden-watchdog.yml
      - .github/scripts/watch-zn-interactive-runner.ps1
      - .github/scripts/install-zn-interactive-runner-watchdog.ps1
      - .github/scripts/test-zn-interactive-desktop-readiness.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/zn-interactive-runner-hidden-watchdog.yml
      - .github/scripts/watch-zn-interactive-runner.ps1
      - .github/scripts/install-zn-interactive-runner-watchdog.ps1
      - .github/scripts/test-zn-interactive-desktop-readiness.ps1
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zn-interactive-runner-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: Wake existing interactive runner task
    runs-on: [self-hosted, Windows, X64, zn-ci]
    timeout-minutes: 5
    steps:
      - name: Require headless recovery runner
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN interactive recovery requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -notmatch '^zn-ci-') {
            throw "ZN interactive recovery requires a zn-ci service runner; got $env:RUNNER_NAME"
          }
      - name: Start existing interactive runner task when stopped
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $taskName = 'ZN GitHub Actions Interactive Runner Watchdog'
          $task = Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction SilentlyContinue
          if ($null -eq $task) {
            Write-Host 'No interactive runner task exists on this host. Repository recovery cannot create an interactive desktop principal from Session 0; configure it from the logged-on zn-interactive session.'
            exit 0
          }
          if ($task.Principal.LogonType -notin @('Interactive','InteractiveToken')) {
            throw "Refusing to start interactive runner task outside interactive logon boundary: $($task.Principal.LogonType)"
          }
          Write-Host "task.state.before=$($task.State)"
          if ([string]$task.State -ne 'Running') {
            Start-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop
            Start-Sleep -Seconds 15
            $task = Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop
          } else {
            Write-Host 'Interactive runner task is already Running; recovery does not kill or replace a live listener.'
          }
          Write-Host "task.state.after=$($task.State)"
          Write-Host 'Recovery only wakes the existing interactive task. It does not unlock Windows, change the interactive principal, or restart a task that is already running.'

  configure:
    name: Configure visible interactive runner task
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [recover]
    runs-on: [self-hosted, Windows, X64, zn-interactive]
    timeout-minutes: 10
    steps:
      - name: Require dedicated interactive runner
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "ZN interactive watchdog configuration requires Windows X64; got $env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          if ($env:RUNNER_NAME -ne 'zn-interactive') {
            throw "ZN interactive watchdog configuration requires zn-interactive; got $env:RUNNER_NAME"
          }
          $sessionId = (Get-Process -Id $PID -ErrorAction Stop).SessionId
          if ($sessionId -eq 0) {
            throw 'ZN interactive watchdog configuration requires a logged-on interactive session, not Session 0.'
          }
          Write-Host "runner.name=$env:RUNNER_NAME"
          Write-Host "runner.session_id=$sessionId"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure repository-owned visible watchdog
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .\.github\scripts\install-zn-interactive-runner-watchdog.ps1
      - name: Verify visible logon task
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $taskName = 'ZN GitHub Actions Interactive Runner Watchdog'
          $task = Get-ScheduledTask -TaskPath '\' -TaskName $taskName -ErrorAction Stop
          $actions = @($task.Actions)
          if ($actions.Count -ne 1) { throw "unexpected watchdog action count: $($actions.Count)" }
          $arguments = [string]$actions[0].Arguments
          if ($arguments -match '(?i)-WindowStyle\s+Hidden') { throw 'watchdog task still requests hidden PowerShell' }
          if ($actions[0].Execute -notmatch '(?i)\\cmd\.exe$') { throw 'interactive task must launch cmd.exe visibly' }
          if ($arguments -notmatch '(?i)/d\s+/c' -or $arguments -notmatch '(?i)run\.cmd') { throw 'interactive task must launch runner run.cmd' }
          if ($task.Settings.Hidden) { throw 'watchdog task is still marked hidden' }
          if ($task.Principal.LogonType -notin @('Interactive','InteractiveToken')) {
            throw "watchdog task left interactive desktop boundary: $($task.Principal.LogonType)"
          }
          $triggers = @($task.Triggers)
          if ($triggers.Count -ne 1 -or [string]$triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger') {
            throw 'watchdog task must have exactly one logon trigger'
          }
          Write-Host "watchdog.task=$taskName"
          Write-Host "watchdog.visible=$(-not $task.Settings.Hidden)"
          Write-Host "watchdog.trigger=$($triggers[0].CimClass.CimClassName)"
          Write-Host 'Visible interactive runner task configuration verified.'
