appId: ai.zn.desktop
productName: ZN
executableName: ZN
protocols:
  - name: ZN Protocol
    schemes:
      - zn
artifactName: ZN-${version}-${os}-${arch}.${ext}
icon: assets/icon
directories:
  output: release
files:
  - dist/**
  - assets/**
  - package.json
beforeBuild: scripts/before-build.mjs
extraResources:
  - from: build/zn-runtime
    to: zn-runtime
  - from: assets/icon.ico
    to: icon.ico
asar: true
afterSign: scripts/notarize.mjs
asarUnpack:
  - dist/**
mac:
  category: public.app-category.productivity
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.inherit.plist
  extendInfo:
    CFBundleDisplayName: ZN
    CFBundleExecutable: ZN
    CFBundleName: ZN
  gatekeeperAssess: false
  hardenedRuntime: true
  target:
    - dmg
    - zip
dmg:
  title: Install ZN
  backgroundColor: '#f5f5f7'
  iconSize: 96
  window:
    width: 560
    height: 360
  contents:
    - x: 160
      y: 170
      type: file
    - x: 400
      y: 170
      type: link
      path: /Applications
win:
  legalTrademarks: ZN
  target:
    - nsis
    - msi
  signAndEditExecutable: false
linux:
  category: Utility
  maintainer: ZN Project
  synopsis: Resident AI workbench for ZN.
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: ai.zn.desktop
  target:
    - AppImage
    - deb
    - rpm
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: ZN
  uninstallDisplayName: ZN
  warningsAsErrors: false
